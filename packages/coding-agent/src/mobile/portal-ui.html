<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e0e0e0" media="(prefers-color-scheme: light)">
<title>omp</title>
<style>
/* Palette and layout are omp's TUI, not a web design.

   Every colour here is a token from omp's own theme system
   (packages/coding-agent/src/modes/theme/theme.ts and the `dark`/`light` theme
   JSON beside it), and the four surfaces are the fullscreen viewport's derived
   "surface ladder": one anchor (`statusLineBg`) with every RGB channel stepped
   +10 per rung on a dark theme, -5 on a light one. Those four flat, opaque
   fills are the ONLY thing that marks a boundary in the fullscreen TUI — it
   draws no borders and no rounded corners anywhere in the transcript — so the
   contrast between `--canvas` and `--panel` is load-bearing rather than
   decorative, and nothing in this file may reintroduce a rule or a radius to do
   a fill's job.

   The values below are the BUILT-IN `dark`/`light` themes, so this file renders
   correctly opened on its own (which is how the render-function test suite loads
   it). The portal overrides them with the host's configured theme by injecting a
   later `:root` block of the same specificity — see `mobile/theme-css.ts`. Token
   names match omp's own (`--muted` is `muted`, `--sl-path` is `statusLinePath`)
   so a rule here can be read against the TUI component it mirrors. */
:root {
  color-scheme: dark;
  /* Surface ladder, derived from `statusLineBg: #121212`. */
  --canvas: #121212; --panel: #1c1c1c; --element: #262626; --overlay: #303030;
  --fg: #e5e5e7; --muted: #777d88; --dim: #5f6673;
  --accent: #febc38; --success: #89d281; --error: #fc3a4b; --warning: #e4c00f;
  --border-muted: #3d424a; --thinking: #777d88; --tool-output: #777d88;
  --diff-add: #89d281; --diff-del: #fc3a4b;
  --user-bg: #221d1a; --custom-bg: #2a2530;
  --link: #0088fa; --code: #e5c1ff; --code-block: #9CDCFE;
  --sl-model: #d787af; --sl-path: #00afaf; --sl-context: #8787af;
  --sl-sep: #808080; --sl-agents: #febc38; --context-purple: #b281d6;
}
/* Light: explicit `data-theme` override first, then the system fallback — the
   same two-tier shape the injected block uses, so `?theme=light` pins the
   palette and otherwise the OS decides. */
[data-theme="light"] {
  color-scheme: light;
  --canvas: #e0e0e0; --panel: #d2d2d2; --element: #c4c4c4; --overlay: #b6b6b6;
  --fg: #000000; --muted: #6c6c6c; --dim: #767676;
  --accent: #5a8080; --success: #588458; --error: #aa5555; --warning: #9a7326;
  --border-muted: #b0b0b0; --thinking: #6c6c6c; --tool-output: #6c6c6c;
  --diff-add: #588458; --diff-del: #aa5555;
  --user-bg: #e8e8e8; --custom-bg: #ede7f6;
  --link: #547da7; --code: #5a8080; --code-block: #588458;
  --sl-model: #875f87; --sl-path: #005f87; --sl-context: #5f5f87;
  --sl-sep: #808080; --sl-agents: #5a8080; --context-purple: #875f87;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --canvas: #e0e0e0; --panel: #d2d2d2; --element: #c4c4c4; --overlay: #b6b6b6;
    --fg: #000000; --muted: #6c6c6c; --dim: #767676;
    --accent: #5a8080; --success: #588458; --error: #aa5555; --warning: #9a7326;
    --border-muted: #b0b0b0; --thinking: #6c6c6c; --tool-output: #6c6c6c;
    --diff-add: #588458; --diff-del: #aa5555;
    --user-bg: #e8e8e8; --custom-bg: #ede7f6;
    --link: #547da7; --code: #5a8080; --code-block: #588458;
    --sl-model: #875f87; --sl-path: #005f87; --sl-context: #5f5f87;
    --sl-sep: #808080; --sl-agents: #5a8080; --context-purple: #875f87;
  }
}
:root {
  /* The composer's text selection: `panelBg` pulled 26% toward the accent, which
     is exactly `deriveSelectionWash`'s blend in sRGB. The theme module then walks
     the result until it clears 1.5:1 against the panel; CSS cannot express that
     walk, so the handful of themes whose accent sits almost on their panel get a
     fainter wash here than in the terminal. */
  --selection: color-mix(in srgb, var(--accent) 26%, var(--panel));
  --line-height: 18px;
  /* The TUI's transcript geometry, in the units a monospace page has:
     `padX: 2` viewport gutter, `CARD_PADDING_X: 2` card inset, `CARD_PADDING_Y: 1`
     filled row above and below a card, and exactly one unpainted canvas row
     between blocks. A "row" is `--line-height` rather than the `lh` unit, which
     iOS only learned in 16.4 and which this file has no other reason to require. */
  --gutter: 2ch; --card-pad-x: 2ch; --card-pad-y: var(--line-height); --block-gap: var(--line-height);
  /* Text-entry controls are 16px while everything else stays 12px, and that is
     not a taste call. WebKit zooms the page whenever a control with a computed
     font-size under 16px takes focus, and on iOS it does not zoom back out on
     blur: the layout viewport stays wider than the screen, so the app has to be
     panned sideways for the rest of the visit. `user-scalable=no` and
     `maximum-scale=1` cannot fix it — WebKit ignores both so that pinch-zoom
     always works, which is the right call and the reason the *size* has to be
     the fix. No pointer media query either: an iPad with a trackpad answers
     `pointer: fine` and would zoom anyway, and this surface is phone-first. */
  --input-size: 16px;
  /* 18px is a 1.5 ratio on 12px text; on 16px it is 1.125, which puts the caret
     into the descenders of the line above in a wrapped field. */
  --input-line: 21px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
/* `hidden` must beat the layout display values below. */
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; scrollbar-width: thin;
       scrollbar-color: color-mix(in srgb, var(--fg) 22%, transparent) transparent; }
body {
  height: 100%;
  font: 400 12px/var(--line-height) ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  color: var(--fg); background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* Only the fields: a `button` cannot take a focus zoom, and growing the chrome
   with them would cost the dense look for nothing. */
input, select, textarea { font-size: var(--input-size); }
/* Squared and borderless by default, like every control in the fullscreen TUI. */
button { cursor: pointer; background: none; border: 0; border-radius: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
::selection { background: var(--selection); }
input, textarea { caret-color: var(--accent); }

/* ── frame ───────────────────────────────────────────────────────────── */
/* `--app-h` is set only while an on-screen keyboard is covering part of the
   screen and the browser did not shrink the layout viewport itself — see
   `applyViewport`. `100dvh` is the better answer the rest of the time.

   `grid-template-columns: minmax(0,1fr)` is what fixes the screen width, and it is
   not decoration. With no explicit column the implicit one is `auto`, which is
   sized to its widest item's *max-content* and is free to exceed a definite
   container: the new-session `<select>` reports the width of its longest option —
   a directory path — so one deep recent path widened the entire shell to 411px on
   a 390px screen. Nothing scrolled inside `main`; the document itself became
   pannable, which on a phone is indistinguishable from a zoom that never came
   back, and `send` ended up past the right edge. A definite column also gives the
   `width: 100%` on that select something real to resolve against. */
#app { display: grid; grid-template-rows: auto minmax(0,1fr) auto; grid-template-columns: minmax(0,1fr); height: var(--app-h, 100dvh); }

/* The header is the one piece of chrome the TUI has no counterpart for — the
   terminal's title bar is the terminal's. It rides the panel surface so it reads
   as the same rung as the composer at the other end of the screen, and it is
   separated from the canvas by that fill alone: no rule, matching the fullscreen
   viewport, which replaced every `├──┤` with a blank filled row. */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 4px var(--gutter); padding-top: calc(4px + env(safe-area-inset-top, 0px));
  background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
/* `π`, the TUI status line's own leading badge (`icon.pi`, in `accent`). */
.brand b { color: var(--accent); font-weight: 650; letter-spacing: 0.01em; }
/* `muted`, not `dim`: this is the app's only persistent statement of what the open
   session is doing, and at the `dim` tier it sat at the same contrast as the
   decoration around it. */
.brand .sub { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A pending approval outranks every other state here — the host is blocked on the
   reader — and takes the `warning` role the prompt itself uses, so the header and the
   panel agree at a glance. */
.brand .sub.ask { color: var(--warning); }
/* One control scale for the whole app. 44px is the iOS minimum and this surface
   is phone-only, so the control keeps its dense look while the tap target is a
   thumb's worth of it — the header buttons used to be 26px tall and 6px apart,
   which put `stop` one mis-tap away from navigating out of the session.

   Squared and borderless: a control in the fullscreen TUI is a row of the
   surface it sits on, lifted one rung when the pointer is over it
   (`hoverBg` === `elementBg`). `--element` is therefore both the hover fill and
   the press fill — on a phone there is no hover, so the press is what the reader
   actually sees. */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 3px 10px;
  color: var(--muted); background: var(--element);
  /* A label is one row in a terminal and has to be one here: `← all` wrapped to two
     lines inside its own box the moment the header ran out of room. */
  white-space: nowrap;
  transition: background .14s ease, color .14s ease;
}
.btn:hover, .btn:active { background: var(--overlay); color: var(--fg); }
.btn-accent { color: var(--canvas); background: var(--accent); }
.btn-accent:hover, .btn-accent:active { color: var(--canvas); background: var(--accent); filter: brightness(.92); }
.btn-stop { color: var(--error); }
.btn-go { color: var(--success); }
/* A disabled control must not keep offering hover and press feedback: the start
   button spends a whole request round trip disabled, which on a phone tunnel is
   exactly when a second tap happens. */
.btn:disabled { opacity: .55; cursor: default; }
.btn:disabled:hover, .btn:disabled:active { background: var(--element); color: var(--muted); filter: none; }

main { overflow-y: auto; overscroll-behavior: contain; background: var(--canvas); }
/* `padX: 2` on each side and `padBottom: 1` at the end of the viewport. The
   leading row is one canvas row too — the same gap blocks keep between each other,
   so the first card sits one rhythm-row off the header instead of flush against
   it. It is padding on the SCROLL content rather than on `main`, which keeps the
   TUI's property that the leading row scrolls away with the content instead of
   sitting there as chrome; zero was only right for a viewport whose top edge is
   the screen edge, and this one has a header bar above it. */
.wrap { max-width: 880px; margin: 0 auto; padding: var(--block-gap) var(--gutter); }

/* ── session list ─────────────────────────────────────────────────────────
   The list has no TUI counterpart either (a terminal shows one session), so each
   row borrows the transcript card's shape: a panel-filled block, squared, one
   canvas row of separation, lifting to `--element` under a thumb. */
.card {
  display: block; width: 100%; text-align: left;
  padding: var(--card-pad-y) var(--card-pad-x); margin-bottom: var(--block-gap);
  background: var(--panel);
  transition: background .14s ease;
}
.card:hover, .card:active { background: var(--element); }
.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-name { font-weight: 650; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-cwd { color: var(--sl-path); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Fixed columns rather than a free wrap. This surface has no TUI counterpart, so
   nothing constrains it — and with `flex-wrap` over variable-length values, `◫`,
   `⏱` and `pid` landed at a different x on every card, so comparing context or age
   down a list of look-alike sessions (the whole job of this screen) became a
   per-card read. Two rows of three, so the second row's numbers line up: model /
   state / agents, then context / age / pid. `min-content` on the last column lets a
   long model name take the space rather than wrapping the row. */
.meta {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr);
  gap: 3px 14px; margin-top: 4px; font-size: 11px; color: var(--muted);
}
.meta > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .k { color: var(--dim); }
/* The subagent chip, emphasised against its neighbours because on a session that is
   `idle` with agents still running it is the only thing on the card explaining why.
   `.meta .k.ag-run` rather than `.ag-run` alone: `.meta .k` is two selectors and
   would win on specificity, which silently rendered the chip the same faint grey as
   `pid`. */
.meta .k.ag-run { color: var(--sl-agents); }
/* Same two-selector reason as `.ag-run` above, and the same accent: an unsent draft
   is the reader's own business on a card that is otherwise all about the agent. */
.meta .k.draft { color: var(--accent); }
/* An empty transcript is an INSTRUCTION, not a hint, so it takes the body colour and
   the text column every other row starts at. Centred dim text was the only centred
   text in the app, and the one row that has to be read on a session with nothing
   else on screen was also its faintest. */
.empty { padding: var(--block-gap) var(--card-pad-x); color: var(--fg); }
.empty .card-cwd { color: var(--sl-path); }

/* status dot — the TUI's ● run-state marker (`status.enabled`), drawn as the
   glyph itself rather than a CSS circle so nothing on the page is round. */
.dot { flex: none; color: var(--dim); }
.dot.run { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.ask { color: var(--warning); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* Two infinite animations run on this page — this dot and the working line's
   spinner. Both mean "still live", and both are decoration over a fact the row
   already states in words, so a reader who has asked the OS to stop moving things
   loses nothing by holding them still. The spinner's frame ticks in JS, so it also
   checks this query; the dot is pure CSS and stops here. */
@media (prefers-reduced-motion: reduce) {
  .dot.run, .dot.ask { animation: none; }
}

/* context usage — the status line's `◫ 22.1%/984K`, verbatim. It used to be a
   rounded progress pill, which is the one shape the TUI never draws; the
   terminal states the number and colours it by threshold, so this does too. */
.ctx { color: var(--sl-context); }
.ctx.warn { color: var(--warning); }
.ctx.high { color: var(--context-purple); }
.ctx.crit { color: var(--error); }

/* markdown tables — box-drawn like the TUI (boxSharp glyphs), so they stay a
   grid instead of reflowing into a web table. Scrolls horizontally rather than
   crushing columns on a narrow screen. */
pre.tbl {
  margin: 8px 0; padding: 0; overflow-x: auto; overscroll-behavior-x: contain;
  background: none; border: 0; border-radius: 0;
  /* The BORDERS are the muted tier — the grid is chrome — and the cells are body
     text, which is what they are: a table is somewhere the agent put an answer, and
     the numbers in it were rendering at the same contrast as the box drawing around
     them. `.tbl-rule` carries the glyphs; everything else inherits. */
  font: inherit; line-height: 1.35; color: var(--fg); white-space: pre;
  -webkit-overflow-scrolling: touch;
}
.tbl-rule { color: var(--muted); }
/* The box-drawn grid only lines up if every glyph shares one advance width, and
   the UA stylesheet gives <code> its own `monospace` family — a different font
   from the body stack, which shears the right border wherever a cell contains
   inline code. Inheriting the family and size is what keeps the table square. */
pre.tbl b, pre.tbl code { font-family: inherit; font-size: inherit; letter-spacing: inherit; }
pre.tbl b { color: var(--fg); font-weight: 650; }
pre.tbl code { padding: 0; background: none; color: var(--code); }

/* working line — the TUI's `Loader`: one canvas row, a braille spinner in the
   accent, the in-flight tool call's own `i` intent, then the ⟦esc⟧ interrupt
   hint. No fill and no frame — in the terminal this line sits on the canvas
   between the transcript and the composer panel, which is why the old bordered,
   accent-railed, raised box had to go.

   The live thinking trace that used to hang underneath is gone with it: this
   surface hides reasoning, exactly as `hideThinkingBlock` does in the TUI. */
/* No horizontal padding: `.wrap` already supplies the viewport gutter, and the
   TUI's Loader sits at that gutter — two columns to the left of card content,
   which is what makes it read as a line about the session rather than a block in
   the transcript. */
.working {
  display: flex; align-items: flex-start; gap: 1ch;
  margin: var(--block-gap) 0 0;
}
.working .spin { flex: none; color: var(--accent); width: 1ch; }
.working .what { min-width: 0; color: var(--fg); font-weight: 650; overflow-wrap: anywhere; }
/* `interruptHint()`: one leading space, then `⟦esc⟧` in the hint palette. */
.working .esc { color: var(--dim); font-weight: 400; }

/* card activity line — what each session is doing, in the list view */
.card-act { display: flex; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--muted); }
.card-act .spin { flex: none; color: var(--accent); }
.card-act .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── transcript: TUI cards ───────────────────────────────────────────────
   Mirrors how the fullscreen terminal draws a turn: assistant prose is bare on
   the canvas at the card's own content column, a user prompt is a filled bubble
   with no prefix glyph, and a tool call is a borderless panel-filled card —
   squared, full width inside the gutter, one blank filled row top and bottom,
   one unpainted canvas row between blocks. Reasoning is not drawn at all.
   Glyphs are omp's unicode symbol preset
   (packages/coding-agent/src/modes/theme/theme.ts → UNICODE_SYMBOLS). */
.turn { margin: 0 0 var(--block-gap); }

/* user prompt — the TUI's `userMessageBg` bubble: `paddingX 1`, `paddingY 1`, and
   deliberately NO leading chevron. The `❯ ` this used to print was a portal
   invention; the terminal separates a prompt from the prose around it with the
   fill alone, and printing both said the same thing twice.
   `pre-wrap` and `overflow-wrap` for the same reason `.tool-body` carries them: a
   prompt can be several lines. It could not be until the composer became a
   textarea, so this rendered a pasted stack trace — the input the textarea exists
   for — as one collapsed paragraph, and an unbroken 200-character token as
   ~1600px of horizontal scroll inside the transcript. */
.user-line {
  padding: var(--line-height) 1ch; background: var(--user-bg);
  color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere;
}

/* assistant prose — no chrome, at the same column as a card's content
   (`isFullscreenViewport() ? 2 : 1` in `assistant-message.ts`). */
.md { padding-left: var(--card-pad-x); color: var(--fg); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { margin: 12px 0 4px; font-size: 12px; font-weight: 650; color: var(--accent); }
.md h1::before { content: "# "; color: var(--dim); font-weight: 400; }
.md h2::before { content: "## "; color: var(--dim); font-weight: 400; }
.md h3::before { content: "### "; color: var(--dim); font-weight: 400; }
.md p { margin: 4px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 0; list-style: none; }
.md li { padding-left: 16px; position: relative; }
/* `md.bullet` / `mdListBullet`. */
.md ul > li::before { content: "•"; position: absolute; left: 4px; color: var(--accent); }
.md ol { counter-reset: n; }
.md ol > li { counter-increment: n; }
.md ol > li::before { content: counter(n) "."; position: absolute; left: 0; color: var(--accent); }
.md b, .md strong { font-weight: 650; color: var(--fg); }
.md em { font-style: italic; color: var(--muted); }
.md a { color: var(--link); }
/* `mdCode`, unfilled and unrounded: the terminal colours inline code and draws
   nothing behind it. */
.md code { padding: 0; background: none; color: var(--code); }
.md hr { margin: 8px 0; border: 0; border-top: 1px solid var(--border-muted); }
.md blockquote { margin: 4px 0; padding-left: 1ch; border-left: 1px solid var(--border-muted); color: var(--muted); }
/* A fenced block is `mdCodeBlock` text on the element rung — the raised surface a
   code frame gets in the fullscreen viewport — with no rule and no radius. */
.md pre {
  margin: 6px 0; padding: 4px 1ch; overflow-x: auto;
  background: var(--element); border: 0; border-radius: 0;
}
.md pre code { padding: 0; background: none; color: var(--code-block); }

/* ── tool call ────────────────────────────────────────────────────────────
   A `BlockCard`: `Box(CARD_PADDING_X = 2, CARD_PADDING_Y = 1)` painted with
   `panelBg`, no border, no corners, and no per-state tint — a settled call that
   succeeded and one that failed share one fill, and the state is carried by the
   status glyph and the text colour, exactly as `tool-execution.ts` documents.

   The whole card is the hit zone ("the fill is what the pointer sees, so the fill
   is the target"), so it is a <button>: one tap toggles collapsed/expanded.

   The press goes one rung PAST the terminal's hover (`--overlay`, not `--element`)
   and does it with no transition. A mouse hover is a sustained state that a 1.1:1
   fill change can afford to announce gently; a tap is ~100ms, and behind a 140ms
   ease the fill never reached its target before the finger left. Release keeps the
   ease, so the card settles rather than snapping. */
.tool {
  display: block; width: 100%; text-align: left;
  padding: var(--card-pad-y) var(--card-pad-x);
  background: var(--panel); color: var(--fg);
  transition: background .14s ease;
}
.tool:active { background: var(--overlay); transition: none; }
/* A card that hides nothing is inert in the TUI: no hover fill, no pointer
   cursor, and a click does nothing rather than toggling invisibly. */
.tool:not(.more) { cursor: default; }
.tool:not(.more):active { background: var(--panel); }
/* `renderStatusLine`: `<icon> <title>` with the title in `accent`, then
   `: <description>` in `muted`.

   A COLLAPSED card is exactly one row, as it is in the terminal: `#summaryRow`
   fits the identity to the card's width and lets `truncateToWidth` end it in `…`.
   Wrapping instead turned a `cd … && ninja … && ctest …` command into a
   three-row block, which is most of a phone screen spent on a call that has
   already finished — the opposite of what collapsing is for. Expanding releases
   the clamp, so the full command is one tap away. */
/* Three flex children, and the split is what keeps the badge on screen: `.tool-id`
   is the only elastic one, so the identity gives up columns first and the trailing
   metadata — the `⟦+N/-M⟧` change badge, the expand hint — never does. Inside one
   span the badge was the FIRST thing an ellipsis ate, which made the row an edit
   card with no line counts on every phone-width screen. */
.tool-head { display: flex; gap: 1ch; align-items: baseline; }
.tool-id { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool[aria-expanded="true"] .tool-id { overflow-wrap: anywhere; white-space: normal; }
.tool-head .sigil { color: var(--accent); }
.tool-head .title { color: var(--accent); }
/* The argument is the payload, not a hint: it is the path or the command, and a
   phone shows a fifth of the characters a terminal row does. `muted` is the TUI's
   colour for it, and on this surface it put the one identifying string in the row
   at the same contrast as the decoration around it. */
.tool-head .arg { color: var(--fg); }
/* The language icon `getLangIcon` puts in front of a write/edit path, and the
   accent path itself. */
.tool-head .lang { color: var(--muted); }
.tool-head .path { color: var(--accent); }
/* `formatChangeStatsSuffix`: ` ⟦+N/-M⟧`, brackets and the slash in `dim`, the
   counts in the diff palette. `flex: none` for the reason above. */
.tool-stats { flex: none; }
.tool-stats .stat-add { color: var(--diff-add); }
.tool-stats .stat-del { color: var(--diff-del); }
.tool-stats .bracket { color: var(--dim); }
/* `formatExpandHint` in `interactiveHint` (the `dim` role), flush right with at
   least one space before it, and never dropped: nothing else on a collapsed card
   says that it opens.

   The WORDING is this surface's own, and it has to be. `formatExpandHint` already
   keys its text to the surface it draws on (`⌥↩: Expand` in append mode,
   `click to expand` in the viewport), and neither fits: "click" is not the gesture
   a phone has, and at 390px the viewport's phrasing measured 16.4 of the row's
   44.6 columns — 39% of the line spent on boilerplate, leaving 19 characters of a
   131-character command, which is not enough to tell two adjacent cards apart.
   `⟦tap⟧` is 5 columns and says the same thing in the right verb.

   `⟦collapse⟧` on an expanded card is the one addition to the vocabulary. The
   terminal can drop the hint once open because the hover fill still marks the card
   as live; a touch screen has no hover, so without a label an expanded card is a
   dead end. */
.tool-hint { flex: none; color: var(--dim); }
/* While a card is open its head is the ONLY collapse target, and it stays on
   screen. A mouse click cannot be confused with a scroll; a touch CAN — a flick
   that fails the movement threshold is a tap — and collapsing a 200-row card drops
   the reader thousands of pixels from where they were with no undo. Sticky because
   the label and the target have to coincide: `⟦collapse⟧` at the top of a body four
   screens tall is a control the reader cannot reach without scrolling back. */
.tool[aria-expanded="true"] { cursor: default; }
.tool[aria-expanded="true"]:active { background: var(--panel); }
.tool[aria-expanded="true"] .tool-head {
  position: sticky; top: 0; z-index: 1; cursor: pointer;
  background: var(--panel); padding: var(--card-pad-y) 0; margin-top: calc(-1 * var(--card-pad-y));
}
/* The output body, flush under the identity row at the same column — the
   fullscreen viewport zeroes the block's own padding because the card supplies
   the whole inset, and it draws no `├─ Output ─┤` divider, just a blank row.
   `display: block` because these are spans: see `renderTranscript`. */
.tool-body {
  display: block; margin-top: var(--line-height);
  color: var(--tool-output); white-space: pre-wrap; overflow-wrap: anywhere;
}
.tool.err .tool-body { color: var(--error); }
/* `… N more lines`, the row the terminal leaves above a clipped tail. */
.tool-more-lines { display: block; color: var(--dim); }

/* ── tree panels: todos and subagents ────────────────────────────────────
   Both draw omp's ├/└ guides, and both are built from the same row primitive: a
   fixed guide gutter plus a content column that owns its own wrapping. That
   structure is the whole reason a row survives a 390px content column. Without it
   the guide is an inline sibling of the text, so a wrapped line returns to column 0
   — outside the tree, reading as a new item rather than a continuation — an
   unbreakable token runs off the viewport and makes the whole transcript scroll
   sideways, and `overflow`/`text-overflow` are inert, because neither applies to a
   non-replaced inline element. The todos panel had all three problems and pushed
   ~100px of horizontal scroll into `main` at phone width; it shares the fix. */
.tree-row { display: flex; }
.tree-row > .guide { flex: none; }
.tree-body { min-width: 0; flex: 1; }
/* `pre` is load-bearing too: a guide is literal box-drawing characters padded with
   spaces to a fixed column, and HTML collapses runs of whitespace and strips it at
   line ends. Without it the indent silently loses columns — the todos tree rendered
   4 where 5 were written, and a subagent continuation collapsed to 2 columns, or to
   none at all on the last row. */
.guide { color: var(--dim); white-space: pre; }

/* todos — the TUI's anchored HUD (`#renderTodoList`): a bold accent `Todos` with
   the active phase's `· n/total` in dim, then a `├─`/`└─` tree of phases labelled
   with roman numerals, each with its own ` · done/total`. The active phase is bold
   accent; the others are muted. Task rows carry `☐`/`☑` and the status palette. */
.todos { margin: 0 0 var(--block-gap); padding-left: var(--card-pad-x); }
/* A control, exactly as `.agents-h` below is, and for the same reason: the collapsed
   panel is a summary and the reader needs a way to ask for the whole plan. Same
   32px, same layout, same caret placement — two adjacent panel headers that behave
   the same have to look the same.
   `gap` rather than trusting the count's own leading space: flex blockifies its
   items, which trims leading whitespace, and the header rendered `Todos· 2/5`. */
.todos-h {
  display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px;
  text-align: left; font-weight: 650; color: var(--accent);
}
.todos-h .count { color: var(--dim); font-weight: 400; }
.todos-h .caret { color: var(--dim); font-weight: 400; }
.phase { color: var(--muted); overflow-wrap: anywhere; }
.phase.now { color: var(--accent); font-weight: 650; }
.phase .count { color: var(--dim); font-weight: 400; }
.task { color: var(--dim); overflow-wrap: anywhere; }
.task.now { color: var(--accent); }
.task.done { color: var(--success); text-decoration: line-through; }
.task.blocked { color: var(--warning); }
.task.dropped { color: var(--error); text-decoration: line-through; }

/* subagents — the TUI's anchored "Subagents" HUD, over the shared tree row above.
   Same idiom as the todos panel directly above it (accent header with a dim count,
   ├/└ guides), because in the terminal these two blocks are deliberately the same
   shape and a phone that drew them differently would imply a difference that is not
   there. */
.agents { margin: 0 0 var(--block-gap); padding-left: var(--card-pad-x); }
/* A control, not a heading: the panel is up to ~470px tall at the row cap, sitting
   directly above the composer for as long as a fan-out runs. 32px rather than the
   44px floor `.btn` and the approval options use — a mis-tapped collapse costs one
   tap to undo, and 44px would spend the vertical budget the collapse exists to
   reclaim. */
.agents-h {
  display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px;
  text-align: left; font-weight: 650; color: var(--accent);
}
.agents-h .count { color: var(--dim); font-weight: 400; }
/* Immediately after the count, not pushed to the far edge: a 7px triangle stranded
   200px away from the label does not read as a disclosure control. */
.agents-h .caret { color: var(--dim); font-weight: 400; }
.agents-h .bad { color: var(--error); }
/* One cell, centred, plus its own trailing column: the status glyphs do not share an
   advance width (⟳ is 1.10ch, ✔ is 0.97ch), so an unpinned glyph left the id column
   ragged and shifted every continuation indent by a fraction. `margin-right` because
   the flex row eats the literal space the markup used to carry — without it the glyph
   touched the first letter of the id (`⟳InstallPlanAudit`) and the id started at 3ch
   while the continuation guide indents 4ch. Pinning also survives a user theme that
   overrides the symbol preset. */
.ag-st { flex: none; display: inline-block; width: 1ch; margin-right: 1ch; text-align: center; }
/* `statusLineSubagents`, the token the TUI's own subagent badge uses. */
.ag-run { color: var(--sl-agents); }
.ag-ok { color: var(--success); }
.ag-err { color: var(--error); }
/* Aborted is an interruption, not a failure, and sharing red with `failed` left
   that pair distinguished by a 12px glyph alone. */
.ag-stop { color: var(--warning); }
.ag-off { color: var(--dim); }
/* Live work carries the emphasis; a FINISHED row recedes. Parked is deliberately not
   in that set: the session is disposed but revivable, often waiting on its parent, so
   dimming it to match a completed agent overstated how done it was. */
.ag-id { color: var(--accent); font-weight: 650; overflow-wrap: anywhere; }
.ag-done .ag-id { color: var(--muted); font-weight: 400; }
.ag-meta { color: var(--dim); font-weight: 400; overflow-wrap: anywhere; }
/* The budget split between the two continuation lines follows which one changes. The
   assignment is static context you read once, so one ellipsized line; the live tool is
   why the panel exists and is the signal that an agent is stuck, so it gets the
   two-line clamp. (The reverse — which is what shipped first — truncated a real
   `bash sleep 75; cd … && pnpm` at 48 characters while the label below it spent two
   full lines.) */
.ag-task {
  display: block; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ag-what {
  color: var(--dim); overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ag-more { color: var(--dim); }
/* Screen-reader-only text. The status is otherwise a glyph plus a colour, which
   announces as an unlabeled symbol or not at all — and this is the block that
   changes most often. */
.sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* ── ask / approval prompt ─────────────────────────────────────────────────
   An approval is an overlay in the terminal, so it takes the overlay rung — the
   one surface above a card — instead of a warning-coloured border. The fullscreen
   viewport paints overlays with `overlayBg` and drops their rules entirely
   (`overlay-box.ts` returns blank filled rows where it used to draw `╭──╮`).

   It is STICKY to the bottom of the scroll area, which is where the terminal pins
   its overlay (`bottom-center`). Sitting at the top of the transcript, the further
   into a session the further up the one blocking control lived: `scrollIntoView`
   caught it on arrival, and the next repaint on a bottom-parked view took it away
   again. An approval the reader has to go find is an agent waiting on a user who is
   waiting on the agent. */
#ask {
  position: sticky; bottom: 0; z-index: 2;
  margin: 0 0 var(--block-gap); padding: var(--card-pad-y) var(--card-pad-x);
  background: var(--overlay);
}
/* This is the highest-stakes sentence in the app, in the `warning` role the TUI
   uses for a pending approval. */
#ask .q { color: var(--warning); font-weight: 650; margin-bottom: 8px; }
/* Same 44px floor as `.btn`: these authorise a tool call, and a mis-tap here is not
   recoverable the way a mis-tapped stop is.

   A row in a TUI select list is a fill at rest and lifts one rung when selected or
   hovered — but a terminal ALWAYS has exactly one row selected, and a touch screen
   never does. Painting these on the panel they sit in left four sentences at 1.00:1
   against their container with no affordance at all, and `❯` (`nav.cursor`) on every
   row says "four selected rows" in omp's own vocabulary. So: the inset rung, which
   is the "field in an overlay" idiom the new-session form already uses, pressing UP
   to `--element` (on the overlay, `--element` is one rung toward the canvas, so the
   old press made a light-theme option lighten while every other press darkens), and
   no cursor glyph. */
#ask .opt {
  display: flex; align-items: center; min-height: 44px; width: 100%;
  text-align: left; padding: 6px 1ch; margin-top: 2px;
  background: var(--canvas); color: var(--fg);
}
#ask .opt:active { background: var(--element); }
/* An irreversible option — "and don't ask again" writes a permanent allowlist entry
   — 2px below the reversible one it looks like is a mis-tap waiting to happen. A
   full row of separation and the warning role say which is which; 44px of height
   protects a control from a fat finger, not from a neighbour that means something
   much bigger. */
#ask .opt.always { margin-top: var(--line-height); color: var(--warning); }
.ask-err { margin-top: 8px; font-size: 11px; color: var(--error); }

/* ── new-session form ─────────────────────────────────────────────────────
   Also an overlay: it is a modal the phone opens over the session list. */
#newform {
  padding: var(--card-pad-y) var(--card-pad-x); margin-bottom: var(--block-gap);
  background: var(--overlay);
}
.nf-title { font-weight: 650; color: var(--accent); margin-bottom: 8px; }
.nf-field { display: grid; gap: 4px; margin-top: 8px; }
/* `muted`, not `dim`: these are the form's only labels, and at 11px the dim role
   measured 3.55:1 — structure the user needs, below the contrast floor. */
.nf-field > span { color: var(--muted); font-size: 11px; }
.nf-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
/* A field is the canvas rung inset in the overlay — the darkest surface on the
   page, which is how a terminal input reads against the panel around it. */
#newsuggest, #newdir {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px;
  background: var(--canvas); border: 0; border-radius: 0; color: var(--fg);
}
/* Room for the UA's own chevron, which a long clipped label otherwise runs under. */
#newsuggest { appearance: auto; padding-right: 28px; }
#newdir::placeholder { color: var(--dim); }
/* The primary needs to be the wider of the two: `cancel` is the longer word and
   would otherwise be the physically larger button. */
.nf-actions .btn-accent { min-width: 96px; }
/* Its own line, and wrapping: sharing the button row truncated the one message
   that matters after committing ("started — the session appear…"). */
.nf-status { margin-top: 8px; font-size: 11px; color: var(--muted); }
.nf-status.err { color: var(--error); }

/* Interruption marker, in the `aborted` glyph and warning colour the TUI stamps an
   interrupted turn with. Without it an aborted turn left no trace at all: a prompt
   with no answer read as the agent ignoring the user, and a resumed turn ran
   straight on from the truncated one with no boundary. The trailing hairline rule
   this used to draw is gone with every other rule on the page. */
.stopped { margin: 0 0 var(--block-gap); padding-left: var(--card-pad-x); color: var(--warning); }
/* A prompt another participant sent, named so it does not read as the phone's own. */
.user-from { color: var(--dim); }

/* ── composer ─────────────────────────────────────────────────────────────
   In the fullscreen TUI the composer is a filled panel with no frame at all —
   `custom-editor.ts`'s `COMPOSER_PANEL`: `fill: panelBg`, `paddingLeft: 2`,
   `paddingRight: 2`, `paddingBottom: 1`, and `#borderVisible` forced false
   because "a filled panel already marks its own boundary". Its rows, top to
   bottom, are: one blank filled row, the text, one blank filled row, the status
   line, then `paddingBottom`. Below the panel the viewport's own `padBottom: 1`
   leaves one canvas row before the screen edge.

   That whole stack is reproduced here: `footer` is the canvas (gutters plus the
   trailing row), and `footer .wrap` is the panel. */
footer {
  background: var(--canvas);
  padding: 0 var(--gutter);
  padding-bottom: calc(var(--block-gap) + env(safe-area-inset-bottom, 0px));
}
/* An open keyboard covers the home indicator, so reserving its inset as well
   floats the composer a third of an inch above the keys for no reason. `.kb` is
   set from the visual viewport, the only place that knows. */
body.kb footer { padding-bottom: var(--block-gap); }
/* The panel. Same 880px column as the transcript's `.wrap`, and the vertical
   padding IS the TUI's blank filled row above the text and its `paddingBottom`
   under the status line. */
footer .wrap {
  max-width: 880px; margin: 0 auto;
  padding: var(--line-height) var(--card-pad-x);
  background: var(--panel);
}
/* `flex-end` rather than `center`: the field grows with its content, and send and
   stop belong beside its last line instead of floating at its middle. */
.input-row { display: flex; gap: 8px; align-items: flex-end; }
/* Past `COMPACT_ROWS` rows the field takes the whole width and the buttons wrap
   under it. Sharing the row with them costs the field 160px — two 72px buttons and
   the two 8px gaps around them, none of which shrink, since `stop` and `send` hold
   their slots whether or not a turn is running. That leaves the field 18 characters
   a line at 390px, so the five-row cap showed about 90 characters in total and an
   ordinary two-sentence steer already scrolled. Full width nearly doubles it.

   It costs 52px of transcript at a given row count — the wrapped button line is a
   44px control plus the 8px gap — but the wide field needs fewer rows for the same
   text, so what it actually costs is much less than that and varies with length.
   `send` does not move: the composer is anchored to the bottom, so it grows upward
   and the buttons stay where the thumb left them. `syncComposer` owns the class and
   re-derives it from the text on every sync — see the reference-geometry note. */
.input-row.grown { flex-wrap: wrap; }
.input-row.grown .field { flex: 1 1 100%; }
.input-row.grown #turn { margin-left: auto; }
/* A textarea, not a single-line input: a steer is regularly a paragraph or a
   pasted stack trace, and a one-line field showed a ~30-character window onto it
   with no way to see or fix what had already been typed. It grows from one row to
   five and then scrolls, so the transcript keeps the screen in the common case.

   No fill and no frame at rest: the TUI's composer text sits directly on the panel,
   with no inner box and no prompt glyph in front of the caret (`#getPromptGutter`
   returns nothing for the main editor). The `› ` sigil this used to draw was a
   portal invention and is gone with the field's border.

   Focus lifts the field one rung instead of drawing a ring. That is the TUI's own
   way of marking the live surface (`elementBg`), and it is also what keeps a
   visible focus indicator on a control that otherwise has no outline — a caret
   alone does not satisfy WCAG 1.4.11.

   One row is the 44px the rest of the row's controls use: 21px line + 20px padding
   is 41, and `min-height` supplies the rest. */
.field {
  flex: 1; min-width: 0; display: flex; min-height: 44px; padding: 10px 1ch;
  background: none; border: 0; border-radius: 0; cursor: text;
}
.field:focus-within { background: var(--element); }
/* A steer the portal could not deliver: the text is put back in the field, the line
   at the end of the transcript names the failure, and the fill says which control it
   belongs to. A tint rather than a rule, in the spirit of `toolErrorBg` — and it
   has to survive focus, because tapping `send` on iOS does not blur the textarea,
   so the field is still focused when the failure paints.

   NO transition on this element, and that is load-bearing rather than a style
   preference: with `transition: background .14s` here, WebKit latched the START of an
   interpolation whose target is a `color-mix()` and left the computed background at
   `transparent` indefinitely on the FIRST failure in a page's life — measured stuck
   at 2s in Safari 26.2. The first dropped steer over a flaky tunnel is exactly the
   one that has to paint. An instant fill is also the better focus indicator. */
.field.err, .field.err:focus-within { background: color-mix(in srgb, var(--error) 18%, var(--panel)); }
#msg {
  flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: var(--fg);
  line-height: var(--input-line); max-height: calc(var(--input-line) * 5);
  resize: none; overflow-y: hidden; overflow-wrap: anywhere;
  /* The TUI's `inputCursor` is an unstyled `▏`; the caret takes the text colour,
     not the accent. */
  caret-color: var(--fg);
}
/* The container carries focus for both of them. */
#msg:focus-visible { outline: none; }
/* `hintStyle` is `dim` in `getEditorTheme`, which is what an omp editor hint is. */
#msg::placeholder { color: var(--dim); }
/* Stop and resume are two states of one control, so they share one fixed slot: the
   row's geometry cannot shift under a thumb that is already reaching for it. `send`
   shares that width because the pair reads as a pair, and because an 84px `stop`
   beside a 56px `send` made the secondary control the largest thing in the row —
   the inversion `.nf-actions .btn-accent` exists to prevent in the other form.
   72px holds `resume`, the longest label either takes, at its 70.5px natural width.
   It is deliberately tight: this rule owns the placeholder's width budget, and at
   76px both placeholders wrapped and clipped on a 375px screen. Change it and
   re-measure the copy. */
#turn, #send { flex: none; min-width: 72px; }

/* ── status line ──────────────────────────────────────────────────────────
   The last row of the composer panel, exactly where the TUI puts it: in append
   mode omp paints these segments into the editor's top border, and in the
   fullscreen viewport they become a panel row under the input — "the strip
   describes what SENDING will do, so it belongs under everything that is part of
   composing" (`editor.ts`).

   `margin-top` is the blank filled row the terminal leaves between the text and
   the strip. The left group is flush with the text column and the right group is
   flush right, with plain panel fill between them — in fullscreen the `─` rule
   that fills that gap in append mode is dropped.

   Symbols are omp's `unicode` preset throughout, never `nerd`: a phone browser
   cannot be assumed to have a patched font, and a missing PUA glyph is a
   tofu box in the most persistent row on the screen. The separator is
   `sep.powerlineLeft`/`Right` (`▶`/`◀`) rather than the `powerline-thin` default's
   `>`/`<`, which at 11px read as prose rather than as chrome. */
.statusline {
  display: flex; align-items: baseline; gap: 1ch;
  margin-top: var(--line-height); font-size: 11px; color: var(--fg);
  overflow: hidden; white-space: nowrap;
}
/* Overflow follows the TUI's own precedence, and it is resolved by DROPPING
   segments in `renderStatusLine` rather than by shrinking them here.

   BOTH groups are `flex: none`, and that is the whole measurement. Left as
   `flex: 1 1 auto; min-width: 0` the left group's BOX shrank while its `flex: none`
   children kept their width and drew straight over the right group — a row reading
   `Qwen3.8 Max Pre9iagents ⓘ28.8%/984K` — and because the box fitted, the row's
   `scrollWidth` equalled its `clientWidth` and the drop loop never ran. Sized to
   content, the overflow is real, measurable, and resolved by removing a segment.

   The terminal's elastic `path` segment becomes a static cap here for the same
   reason: a flexible child inside a content-sized parent cannot shrink, and a phone
   row has no columns to lend anyway. */
.statusline .left { display: flex; align-items: baseline; gap: 1ch; flex: none; }
.statusline .right { display: flex; align-items: baseline; gap: 1ch; margin-left: auto; flex: none; }
.statusline .sep { color: var(--sl-sep); flex: none; }
/* `icon.pi`, in the accent, and never dropped. */
.statusline .pi { color: var(--accent); flex: none; }
/* `theme.sep.dot` — literally " · ", spaces included, and an intra-segment joiner
   rather than a separator between segments. */
.statusline .sdot { color: var(--sl-model); }
.statusline .model { color: var(--sl-model); flex: none; }
/* Capped rather than dropped outright: a deep worktree path is the segment the
   terminal preserves longest, so it keeps its tail (`…`) instead of vanishing while
   there is still room for its first 22 columns. */
.statusline .path { color: var(--sl-path); flex: none; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
.statusline .agents { color: var(--sl-agents); flex: none; }
/* `timeSpentSegment` applies no colour at all — it inherits the bar's text fg. */
.statusline .time { color: var(--fg); flex: none; }
/* The context glyph sits OUTSIDE the coloured span in `contextPctSegment`
   (`withIcon(icon, fg(color, text))`), so only the numbers take the threshold
   colour. `.ctx` above carries those four tiers. */
.statusline .ctx-icon { color: var(--fg); flex: none; }

@media (max-width: 640px) {
  .card-cwd { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <!-- `icon.pi`, the glyph the TUI status line leads with, in the accent. -->
    <div class="brand"><b>π</b><span class="sub" id="sub">sessions</span></div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="back" hidden>← all</button>
      <button class="btn" id="new" aria-expanded="false" aria-controls="newform">+ new</button>
    </div>
  </header>
  <main><div class="wrap"><div id="newform" hidden>
    <div class="nf-title">start a new session</div>
    <label class="nf-field">
      <span>directory</span>
      <select id="newsuggest"><option value="">loading…</option></select>
    </label>
    <label class="nf-field" id="newdirfield" hidden>
      <span>path</span>
      <input id="newdir" placeholder="~/ or an absolute path" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <div class="nf-row nf-actions">
      <button class="btn btn-accent" id="start">start</button>
      <button class="btn" id="cancelnew">cancel</button>
    </div>
    <div class="nf-status" id="newstatus" role="status" aria-live="polite"></div>
  </div><div id="list"></div><div id="detail" hidden><div id="ask" role="group" aria-live="assertive" hidden></div><div id="log"></div><div id="todos"></div><div id="subagents"></div><div id="working" class="working" hidden></div><!--
    A steer the portal could not deliver. In the scroll area rather than the
    composer, and that placement is the whole reason it exists: as a footer row it
    would cost the composer 26px of a 375px screen, here it costs nothing — it
    occupies space that already scrolls and scrolls away with the transcript. It is
    the same `.ask-err` line, with the same words, that a rejected `ask` answer
    already gets 40 lines up in this file. The red border alone says "something";
    it cannot say which something, and a restored draft is indistinguishable from
    one that was never sent.
  --><div id="sendfail" class="ask-err" role="status" hidden>could not send that steer — try again</div></div></div></main>
  <footer id="composer" hidden>
    <div class="wrap">
      <div class="input-row">
        <!-- `aria-label` because the placeholder is the only other name this field has
             and it both disappears on the first keystroke and changes between the
             empty-session and ongoing-session states.
             `enterkeyhint` is corrected at runtime: Enter is a newline on a soft
             keyboard and send on a hardware one. -->
        <div class="field"><textarea id="msg" rows="1" aria-label="steer this session" placeholder="steer the agent" enterkeyhint="enter" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
        <!-- No `hidden` attribute: this slot is hidden with `visibility` so the row's
             geometry never depends on turn state, and `[hidden]`'s
             `display:none !important` would win over that and blank the control in
             every state. `renderTurnControl` owns its visibility from the first frame. -->
        <button class="btn btn-stop" id="turn" style="visibility:hidden" title="stop the current turn — the session stays open">stop</button>
        <button class="btn btn-accent" id="send">send</button>
      </div>
      <!-- The status line, the composer panel's last row. `aria-hidden` because every
           number in it is a glyph plus a fragment ("◫ 22.1%/984K"), which announces as
           a run of unlabeled symbols; the header already names the session and its
           state in words, and `renderHeader` keeps that authoritative. -->
      <div class="statusline" id="statusline" aria-hidden="true"></div>
    </div>
  </footer>
</div>
<script>
// `?theme=light|dark` pins the palette; otherwise the OS preference decides.
const pinned = new URLSearchParams(location.search).get("theme");
if (pinned === "light" || pinned === "dark") document.documentElement.dataset.theme = pinned;

const $ = id => document.getElementById(id);
/* Quotes matter as much as angle brackets here: several of these strings land in
   attribute position, and everything this renders — assistant prose, tool output,
   approval labels, ids off the wire — is content the agent produced or fetched. An
   unescaped `"` in a markdown link target was enough to add a `style` attribute and
   float one link over the whole viewport, so every tap hit it instead of stop. */
const ESCAPES = { "<": "&lt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s).replace(/[<&"']/g, c => ESCAPES[c]);

/* Plain-text width of an inline-markdown cell. Column widths must be measured
   on what the eye sees, not on the markup, or every bold cell over-pads. */
const plain = t =>
  String(t)
    .replace(/\[([^\]]+)\]\((?:https?:[^)\s]+)\)/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\*([^*\n]+)\*/g, "$1");

/* Split a table row on unescaped pipes, dropping the leading/trailing ones. */
const splitRow = line =>
  line
    .trim()
    .replace(/^\|/, "")
    .replace(/\|$/, "")
    .split(/(?<!\\)\|/)
    .map(c => c.trim().replace(/\\\|/g, "|"));

/* Greedy wrap on word boundaries, matching how the TUI wraps a table cell. */
function wrapCell(text, width) {
  const words = plain(text).split(/\s+/).filter(Boolean);
  if (!words.length) return [""];
  const lines = [];
  let cur = "";
  for (const w of words) {
    if (!cur) cur = w;
    else if (cur.length + 1 + w.length <= width) cur += ` ${w}`;
    else { lines.push(cur); cur = w; }
    while (cur.length > width) { lines.push(cur.slice(0, width)); cur = cur.slice(width); }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* Widest column we will render before wrapping. Wide enough for a real sentence,
   narrow enough that a three-column table still fits a phone without scrolling. */
const MAX_COL = 34;

/* Render a GFM table as a box-drawn terminal table, using the same glyphs and
   layout as omp's TUI (`boxSharp`: bordered, header separated by a tee row).
   HTML <table> would reflow into something that reads nothing like the terminal,
   so this emits a monospace block and lets it scroll horizontally instead. */
function renderTable(header, aligns, rows, inline) {
  const cols = header.length;
  const widths = [];
  for (let c = 0; c < cols; c++) {
    const cells = [header[c], ...rows.map(r => r[c] ?? "")];
    const longestWord = Math.max(...cells.flatMap(x => plain(x).split(/\s+/).map(w => w.length)), 1);
    const widest = Math.max(...cells.map(x => plain(x).length), 1);
    // Never wrap tighter than the longest single word: mid-word breaks are worse
    // than a slightly wider column.
    widths.push(Math.max(Math.min(widest, MAX_COL), Math.min(longestWord, MAX_COL)));
  }

  const pad = (text, w, align) => {
    const slack = Math.max(0, w - plain(text).length);
    const left = align === "right" ? slack : align === "center" ? Math.floor(slack / 2) : 0;
    return " ".repeat(left) + inline(text) + " ".repeat(slack - left);
  };
  // The grid glyphs, wrapped so they can take the muted tier while the cells stay
  // body text — see `pre.tbl`. A whole row of box drawing is one span.
  const line = (l, mid, r) =>
    `<span class="tbl-rule">${l}${widths.map(w => "─".repeat(w + 2)).join(mid)}${r}</span>`;
  const body = (cells, bold) => {
    const wrapped = cells.map((cell, c) => wrapCell(cell, widths[c]));
    const height = Math.max(...wrapped.map(w => w.length));
    const out = [];
    for (let i = 0; i < height; i++) {
      const parts = wrapped.map((w, c) => {
        // Only the first visual line carries inline markup; continuation lines are
        // already plain text from the wrapper.
        const raw = w[i] ?? "";
        const cell = i === 0 && w.length === 1 ? cells[c] : raw;
        const rendered = pad(cell, widths[c], aligns[c]);
        return bold ? `<b>${rendered}</b>` : rendered;
      });
      const bar = `<span class="tbl-rule">│</span>`;
      out.push(`${bar} ${parts.join(` ${bar} `)} ${bar}`);
    }
    return out;
  };
  const html = [
    line("┌", "┬", "┐"),
    ...body(header, true),
    line("├", "┼", "┤"),
    ...rows.flatMap(r => body(header.map((_, c) => r[c] ?? ""), false)),
    line("└", "┴", "┘"),
  ].join("\n");
  return `<pre class="tbl">${html}</pre>`;
}

/* Small markdown renderer covering what agents actually emit. Deliberately not
   a full parser: headings, lists, quotes, rules, fenced/inline code, bold and
   italic — styled to read like the terminal rather than like a web page. */
function md(src) {
  const out = [];
  const lines = String(src).split("\n");
  let list = null, para = [], fence = null, code = [];
  const inline = t =>
    esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      // No quotes in the URL group: belt and braces with `esc`, so a link cannot
      // carry an attribute even if this string reaches here unescaped later.
      .replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const flush = () => { flushPara(); flushList(); };

  for (let li = 0; li < lines.length; li++) {
    const raw = lines[li];
    const line = raw.replace(/\s+$/, "");
    const fenceMark = /^\s*```(\w*)\s*$/.exec(line);
    if (fence !== null) {
      if (fenceMark) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); fence = null; code = []; }
      else code.push(raw);
      continue;
    }
    if (fenceMark) { flush(); fence = fenceMark[1] || ""; continue; }
    if (!line.trim()) { flush(); continue; }
    // GFM table: a header row immediately followed by a delimiter row. Checked
    // before the horizontal-rule and list branches, whose patterns a delimiter
    // row like `|---|---|` would otherwise partially match.
    if (line.includes("|") && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[li + 1] ?? "") && (lines[li + 1] ?? "").includes("|")) {
      const header = splitRow(line);
      const delim = splitRow(lines[li + 1]);
      if (delim.length === header.length && delim.every(d => /^:?-+:?$/.test(d))) {
        flush();
        const aligns = delim.map(d =>
          d.startsWith(":") && d.endsWith(":") ? "center" : d.endsWith(":") ? "right" : "left",
        );
        const rows = [];
        li += 2;
        while (li < lines.length && lines[li].includes("|") && lines[li].trim()) {
          rows.push(splitRow(lines[li]));
          li++;
        }
        li--; // the loop's own increment consumes the terminating line
        out.push(renderTable(header, aligns, rows, inline));
        continue;
      }
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flush(); out.push("<hr>"); continue; }
    const q = /^>\s?(.*)$/.exec(line);
    if (q) { flush(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }
    const ul = /^\s*[-*+]\s+(.*)$/.exec(line);
    const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul ?? ol)[1]);
      continue;
    }
    flushList();
    para.push(line.trim());
  }
  if (fence !== null && code.length) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("");
}

/* ── the tool card's identity row ─────────────────────────────────────────
   `renderStatusLine` (src/tui/status-line.ts) composes every tool header in the
   TUI as `<icon> <title>[: <description>][ ⟦badge⟧][ <meta>][suffix]`, with the
   title in `accent` and the description in `muted`. The collapsed card in the
   fullscreen viewport is that one row and nothing else.

   Reproduced here rather than shipped over the wire because the frames a guest
   receives carry the tool NAME and ARGUMENTS, not the host's rendered rows: omp
   renders a header at the width of the terminal that drew it, and a phone is a
   different width. The per-tool sigils are `theme.ts`'s `tool.*` keys in the
   unicode preset. */
const TOOL_SIGIL = {
  bash: "❯", write: "✎", edit: "✎", apply_patch: "✎", task: "⇶", todo: "☑",
  web_search: "⌕", browser: "🌐", eval: "▶", debug: "🐞", lsp: "💡", ask: "?",
  ssh: "⇄", memory: "🧠", resolve: "✓", review: "◉", goal: "◎", hub: "✉",
  ast_edit: "✎",
};
/* `read` has no sigil of its own in omp: the grouped read row is stamped with
   `status.enabled` (`●`), the same glyph a successful read reports. */
const READ_SIGIL = "●";
/* Title-cased tool names, matching the `title` each renderer passes
   (`resolveTitle: () => "Bash"`, `title: "Write"`, `getOperationTitle` → Edit).
   Anything not listed keeps its wire name, which is what an extension tool's
   generic card shows. */
const TOOL_TITLE = {
  bash: "Bash", write: "Write", edit: "Edit", apply_patch: "Patch", read: "Read",
  glob: "Glob", grep: "Grep", task: "Task", todo: "Todo", web_search: "Search",
  ast_edit: "AST Edit", hub: "Hub", eval: "Eval",
};
/* The argument each tool is identified by — the `description` half of its header.

   A flat "one key per tool" table is not enough, because the tools whose cards
   matter most do not all carry their identity in a plain string field:

   - `edit` has FOUR parameter shapes, one per edit mode: `patch` and `replace`
     carry `path` outright, while `hashline` and `apply_patch` carry only
     `{ i, input }` and name their files in the patch's own `[PATH#TAG]` section
     headers. Both are handled, because which mode a host runs is a setting: on a
     hashline session every edit card read `✎ Edit` and nothing else, which is the
     single most common card in a transcript, unidentifiable.
   - `task` takes `{ agent }` for one spawn and `{ context, tasks[] }` for a batch;
     `formatAgentHeaderLabel` uses the agent type, so a batch is summarised by its
     spawn names instead.
   - `ast_edit` takes `paths[]`.

   Anything with a single obvious string field stays in the table. */
const TOOL_ARG = { read: "path", write: "path", bash: "command", glob: "path", grep: "pattern", todo: "op", hub: "op", web_search: "query", eval: "title" };
/* Section headers of a hashline / apply_patch payload, which is where those two
   modes name the files they touch. Two different grammars: hashline writes
   `[path#TAG]`, and the apply_patch envelope writes `*** Update File: path`
   (`edit/apply-patch/parser.ts`). `apply_patch` is a real wire tool name — the
   custom-tool spelling GPT-5-class providers get — and its schema is `{ input }`
   with no `path` at all, so without the second pattern every patch card on such a
   session rendered a bare `Patch` with no path, no language icon and no change
   badge: the exact unidentifiable row this identity code exists to remove. */
const HASHLINE_HEADER = /^\[([^\]\n]+?)#[0-9A-Fa-f]{4}\]$/gm;
const APPLY_PATCH_HEADER = /^\*\*\* (?:Add|Delete|Update) File: *(.+)$/gm;
function editPathsOf(input) {
  if (typeof input !== "string") return [];
  const paths = [];
  for (const re of [HASHLINE_HEADER, APPLY_PATCH_HEADER]) {
    for (const match of input.matchAll(re)) {
      const path = match[1].trim();
      if (path && !paths.includes(path)) paths.push(path);
    }
  }
  return paths;
}
function toolArgOf(item) {
  const args = item.args ?? {};
  if (item.name === "edit" || item.name === "apply_patch") {
    // `patch`/`replace` modes: the path is right there.
    if (typeof args.path === "string" && args.path) return args.path;
    const paths = editPathsOf(args.input);
    if (!paths.length) return "";
    return paths.length === 1 ? paths[0] : `${paths[0]} +${paths.length - 1} more`;
  }
  if (item.name === "ast_edit") {
    return Array.isArray(args.paths) ? args.paths.join(" ") : "";
  }
  if (item.name === "task") {
    if (typeof args.agent === "string" && args.agent) return args.agent;
    if (!Array.isArray(args.tasks)) return "";
    const named = args.tasks.map(t => t?.name ?? t?.agent ?? "").filter(Boolean);
    return named.length ? named.join(" · ") : `${args.tasks.length} agents`;
  }
  const raw = TOOL_ARG[item.name] ? args[TOOL_ARG[item.name]] : undefined;
  return typeof raw === "string" ? raw : "";
}
/* `getLangIcon`, the glyph `formatEditDescription` and the write header put in
   front of a path. Only the extensions that actually turn up in a transcript are
   mapped; everything else takes `lang.default`, exactly as the theme's own
   `langMap` lookup does. */
const LANG_ICON = {
  ts: "🟦", tsx: "🟦", mts: "🟦", cts: "🟦", js: "🟨", jsx: "🟨", mjs: "🟨", cjs: "🟨",
  py: "🐍", rs: "🦀", go: "🐹", java: "☕", c: "Ⓒ", h: "Ⓒ", cpp: "➕", cc: "➕",
  cxx: "➕", hpp: "➕", cs: "♯", rb: "💎", jl: "Ⓙ", php: "🐘", swift: "🕊", kt: "🅺",
  sh: "💻", bash: "💻", zsh: "💻", fish: "💻", html: "🌐", css: "🎨", json: "🧾",
  yaml: "📋", yml: "📋", md: "📝", sql: "🗄", lua: "🌙", txt: "🗒", env: "🔧",
  toml: "🧾", xml: "⟨⟩", ini: "⚙", conf: "⚙", log: "📜", csv: "📑", tsv: "📑",
  png: "🖼", jpg: "🖼", jpeg: "🖼", gif: "🖼", svg: "🖼", webp: "🖼", pdf: "📕",
  zip: "🗜", tar: "🗜", gz: "🗜", tgz: "🗜",
};
const DEFAULT_LANG_ICON = "⌘";

/* `shortenPath`: an absolute path under $HOME collapses to `~/…`. The home
   directory is not on the wire, so this matches the shape omp emits rather than
   the exact prefix — `/Users/<name>/` and `/home/<name>/` are the two layouts a
   host can have, and neither can be a real project directory on its own. */
const shortenPath = value =>
  String(value).replace(/^(?:\/Users|\/home)\/[^/]+(?=\/|$)/, "~");

/* ` ⟦+N/-M⟧` — `formatChangeStatsSuffix`. A side with no lines is omitted rather
   than printed as `-0`, and an empty change set yields no badge at all. */
function statsSuffix(added, removed) {
  const parts = [];
  if (added > 0) parts.push(`<span class="stat-add">+${added}</span>`);
  if (removed > 0) parts.push(`<span class="stat-del">-${removed}</span>`);
  if (!parts.length) return "";
  const slash = `<span class="bracket">/</span>`;
  return ` <span class="bracket">⟦</span>${parts.join(slash)}<span class="bracket">⟧</span>`;
}

/* `clampPathLength` (`segments.ts`): a path over budget keeps its TAIL and takes
   the ellipsis at the front. The filename and its directory are what identify a
   card; the repo root above them is the same on every row of a session and is
   already in the status line. A tail-clamped `~/oss/oh-my-pi/packages/coding-ag…`
   identifies nothing. 34 is the widest that leaves room for the sigil, the title
   and the badge on a 390px screen. */
const PATH_MAX = 34;
const clampPath = value => (value.length <= PATH_MAX ? value : `…${value.slice(-(PATH_MAX - 1))}`);

/* A `cd <dir> && real command` prefix, which agents write constantly and which is
   pure noise on this surface: the cwd is in the status line one row below, and at
   19 visible characters the prefix WAS the whole visible row — five adjacent cards
   all reading `❯ Bash: cd ~/hyperplane-wt-…` and telling each other apart nowhere.
   Only a leading `cd`, and only up to the first `&&`, so a `cd` in the middle of a
   pipeline is left alone. */
const stripLeadingCd = value => value.replace(/^cd\s+(?:"[^"]*"|'[^']*'|[^\s&|;]+)\s*&&\s*/, "");

/* The card's identity row, split into the elastic part and the fixed trailing
   badge: `{ id, stats }` rather than one string, because inside a single
   ellipsised span the badge is the first thing lost and an edit card at phone
   width never showed its line counts at all.

   Write and edit carry a language icon and a change badge the way their TUI
   headers do; read carries the `:start-end` selector its path spec or its
   `offset`/`limit` args imply, in the same accent as the path. */
function toolIdentity(item) {
  const args = item.args ?? {};
  const name = item.name;
  const title = TOOL_TITLE[name] ?? name;
  const sigil = item.isError ? "✘" : name === "read" ? READ_SIGIL : (TOOL_SIGIL[name] ?? "•");
  const sigilCls = item.isError ? "sigil ag-err" : "sigil";
  const arg = toolArgOf(item);
  const head = `<span class="${sigilCls}">${esc(sigil)}</span> <span class="title">${esc(title)}</span>`;
  // Read is the one row with no colon: `read-tool-group.ts` builds it as
  // `● Read <path>`, and the grouped rows are what a transcript mostly shows.
  if (name === "read") {
    if (!arg) return { id: head, stats: "" };
    // A `path:sel` spec already carries its range; `offset`/`limit` are the other
    // way to ask for one, and the renderer prints them in the same `:a-b` form.
    let path = shortenPath(arg);
    if (!/:[\d,\-]+$/.test(path) && Number.isFinite(args.offset ?? args.limit)) {
      const start = Number.isFinite(args.offset) ? args.offset : 1;
      const end = Number.isFinite(args.limit) ? start + args.limit - 1 : "";
      path += `:${start}${end === "" ? "" : `-${end}`}`;
    }
    // The range is the only thing distinguishing two reads of one file, so it goes
    // in the fixed half where an ellipsis cannot reach it.
    const cut = path.search(/:[\d,\-]+$/);
    const sel = cut < 0 ? "" : path.slice(cut);
    const body = cut < 0 ? path : path.slice(0, cut);
    return {
      id: `${head} <span class="path">${esc(clampPath(body))}</span>`,
      stats: sel ? `<span class="path">${esc(sel)}</span>` : "",
    };
  }
  if (!arg) return { id: head, stats: "" };
  if (name === "write" || name === "edit" || name === "ast_edit" || name === "apply_patch") {
    // The lang icon keys off the FIRST path, which is the one the header names; a
    // multi-file patch carries its own ` +N more` tail from `toolArgOf`.
    const path = shortenPath(arg);
    const ext = /\.([A-Za-z0-9]+)(?:\s|$)/.exec(path)?.[1]?.toLowerCase() ?? "";
    const icon = LANG_ICON[ext] ?? DEFAULT_LANG_ICON;
    // Write counts every line it wrote as an addition (`countLines(fileContent)`);
    // edit takes the real counts off the result's diff, forwarded as `stats`.
    const stats = item.stats
      ? statsSuffix(item.stats.added ?? 0, item.stats.removed ?? 0)
      : name === "write" && typeof args.content === "string"
        ? statsSuffix(args.content.split("\n").length, 0)
        : "";
    return {
      id: `${head}: <span class="lang">${esc(icon)}</span> <span class="path">${esc(clampPath(path))}</span>`,
      stats,
    };
  }
  const text = name === "bash" ? stripLeadingCd(arg) : arg;
  return { id: `${head}: <span class="arg">${esc(text)}</span>`, stats: "" };
}

/* `checkbox.checked` / `checkbox.unchecked`. Every non-completed status shares the
   empty box in the TUI and differs by colour and by an appended `(blocked)` — the
   glyph carries "done or not", the palette carries the rest. */
const TODO_GLYPH = { completed: "☑" };
const TODO_CLASS = {
  completed: "done", in_progress: "now", blocked: "blocked", abandoned: "dropped",
};

/* `phaseRomanNumeral` (src/tools/todo.ts): a one-based ASCII roman numeral, which
   is how every phase in the TUI's HUD is labelled. */
const ROMAN_PAIRS = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
function romanNumeral(oneBased) {
  if (!(oneBased > 0)) return "";
  let out = "";
  let rem = oneBased;
  for (const [value, sym] of ROMAN_PAIRS) {
    while (rem >= value) { out += sym; rem -= value; }
  }
  return out;
}

/* The todos HUD, following `#renderTodoList`: a bold accent `Todos` with the
   ACTIVE PHASE's position (not a task count — the TUI's header answers "which
   stage", and the per-phase rows answer "how much of it"), then a `├─`/`└─` tree
   of roman-numbered phases with the active one in accent and the rest muted.

   COLLAPSED is the default, and it is the terminal's own policy, not a phone
   invention: `#renderTodoList` draws a non-active phase as its header ALONE, caps
   the stages after the active one at 4 (`subsequentStageCap`), and runs the active
   phase's tasks through `selectCollapsedTodos(tasks, isMatched, 5)` — completed and
   abandoned rows omitted, active work pulled to the head, following pending tasks
   filling the remainder, and a `… N more` summary for the rest.

   Rendering every phase and every task instead was not "more information on a
   scrolling surface": measured on a 12-task plan it took 58% of a 390×844 viewport,
   nine of its rows struck-through completions, sitting between the newest transcript
   row and the composer — so every send scrolled past mostly-finished work. The full
   plan is one tap away, exactly as `todoExpanded` is one key away in the TUI. */
const TODO_ACTIVE_CAP = 5;
const TODO_STAGE_CAP = 4;
/* `null` until the reader decides, like `agentsOpen`: the default is the collapsed
   policy, and a choice made in one session does not belong to the next. */
let todosOpen = null;

/* `selectCollapsedTodos` (src/tools/todo.ts). Open work only, unless nothing is
   open — a settled phase still renders, which is the HUD's closed-todo persistence
   — then the active row first and its successors after it, capped. */
function selectCollapsedTodos(tasks, cap) {
  const open = tasks.filter(t => t.status === "pending" || t.status === "in_progress" || t.status === "blocked");
  const base = open.length > 0 ? open : tasks;
  if (base.length <= cap) return { items: base, hidden: 0 };
  // `isActiveTodo` without the subagent-description matching the TUI adds: the phone
  // has no subagent descriptions to match against, so `in_progress` is the signal.
  const active = base.filter(t => t.status === "in_progress");
  if (active.length > cap) return { items: active.slice(0, cap), hidden: active.length - cap };
  const firstActive = active.length > 0 ? base.indexOf(active[0]) : 0;
  const fill = [];
  for (let i = firstActive; i < base.length && active.length + fill.length < cap; i++) {
    if (base[i].status === "in_progress") continue;
    fill.push(base[i]);
  }
  const items = [...active, ...fill];
  return { items, hidden: base.length - items.length };
}

function renderTodos(phases) {
  const kept = (phases ?? []).filter(p => p.tasks?.length);
  if (!kept.length) return "";
  const multi = kept.length > 1;
  // `#getActivePhase`: the first phase with work left, else the last one.
  const open = kept.findIndex(p => p.tasks.some(t => t.status === "pending" || t.status === "in_progress"));
  const activeIdx = open === -1 ? kept.length - 1 : open;
  const expanded = todosOpen === true;
  // The stage window: the active phase and the four after it, which is what keeps a
  // 9-phase plan from pushing the composer off a phone screen. The header's `i/N`
  // states what the window is hiding.
  const shownPhases = expanded ? kept : kept.slice(activeIdx, activeIdx + 1 + TODO_STAGE_CAP);
  const rows = shownPhases.map((p, si) => {
    const pi = expanded ? si : activeIdx + si;
    const last = si === shownPhases.length - 1;
    const pdone = p.tasks.filter(t => t.status === "completed").length;
    const label = multi ? `${romanNumeral(pi + 1)}. ${p.name}` : p.name;
    // `.tree-row`/`.tree-body` and the `aria-hidden` guide are shared with the
    // subagents panel below: without them a long task wrapped back to column 0 and an
    // unbreakable one scrolled the whole transcript sideways, and a screen reader read
    // the box-drawing characters aloud once per line.
    const head =
      `<div class="tree-row"><span class="guide" aria-hidden="true">${last ? "└─" : "├─"} </span>` +
      `<span class="tree-body phase${pi === activeIdx ? " now" : ""}">${esc(label)}` +
      `<span class="count"> · ${pdone}/${p.tasks.length}</span></span></div>`;
    // A non-active phase is its header alone while collapsed: its progress count is
    // the answer, and its tasks are either finished or not started.
    if (!expanded && pi !== activeIdx) return head;
    const sel = expanded ? { items: p.tasks, hidden: 0 } : selectCollapsedTodos(p.tasks, TODO_ACTIVE_CAP);
    const tasks = sel.items.map((t, ti) => {
      // `hasOwn` for the same reason `AGENT_STATE` uses it below: a status of
      // `toString` resolves through Object.prototype, and `??` does not catch a
      // function, so the row printed a native-code string as its checkbox and as
      // part of its class list.
      const cls = Object.hasOwn(TODO_CLASS, t.status) ? TODO_CLASS[t.status] : "";
      const glyph = Object.hasOwn(TODO_GLYPH, t.status) ? TODO_GLYPH[t.status] : "☐";
      const blocked = t.status === "blocked" ? " (blocked)" : "";
      // `getTreeContinuePrefix`: three spaces under a `└─`, `│  ` under a `├─`.
      const lastTask = ti === sel.items.length - 1 && sel.hidden === 0;
      const branch = lastTask ? "└─" : "├─";
      return (
        `<div class="tree-row"><span class="guide" aria-hidden="true">${last ? "   " : "│  "}${branch} </span>` +
        // `aria-hidden` on the glyph: a screen reader announced "ballot box with
        // check" once per row, and the row's own class already carries the state.
        `<span class="tree-body task ${cls}"><span aria-hidden="true">${glyph}</span> ` +
        `${esc(t.content)}${blocked}</span></div>`
      );
    }).join("");
    // `trailingSummary`, the row `renderTreeList` adds under a capped list.
    const summary = sel.hidden > 0
      ? `<div class="tree-row"><span class="guide" aria-hidden="true">${last ? "   " : "│  "}└─ </span>` +
        `<span class="tree-body task">… ${sel.hidden} more todo${sel.hidden === 1 ? "" : "s"}</span></div>`
      : "";
    return head + tasks + summary;
  }).join("");
  const count = multi ? `<span class="count"> · ${activeIdx + 1}/${kept.length}</span>` : "";
  // The same disclosure button the subagents panel is, for the same reason: the
  // collapsed form is a summary and the reader needs a way to ask for the rest.
  return (
