<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f0b14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9fb" media="(prefers-color-scheme: light)">
<title>omp</title>
<style>
/* Palette and type lifted verbatim from omp's own web surfaces:
   packages/coding-agent/src/export/html/web-palette.ts (the vars omp injects on
   :root for share/export pages) and template.css (the "dense devtool aesthetic"
   — mono type, hairlines via color-mix, small radii, whisper hovers). Keeping
   the same tokens means this portal and an omp /share page are the same product. */
:root {
  color-scheme: dark;
  --bg: #0f0b14; --bg-raised: #16111c; --bg-inset: #09060c; --bg-overlay: #211b28;
  --fg: #e6e3ea; --fg-muted: #a49faa; --fg-faint: oklch(0.68 0.015 307);
  --accent: #ed4abf; --accent-muted: oklch(0.674 0.23 341 / 18%);
  /* Three accent roles, because one colour cannot serve all of them at 12px:
     `--accent` for borders and glyphs, `--accent-text` for text on the page
     background, `--accent-solid` as a fill with a label on top. In the dark
     palette they coincide; in the light one they must not. */
  --accent-text: #ed4abf;
  --accent-solid: #ed4abf;
  /* Warn as *text* needs more contrast than warn as a dot or a border. */
  --warn-text: #e4b33f;
  --ok: #68ca80; --err: #f05653; --warn: #e4b33f; --link: #5ad8e5;
  --border: oklch(1 0 0 / 9%); --border-strong: oklch(1 0 0 / 13%);
  --ring: oklch(0.817 0.112 205 / 70%);
}
/* Light: explicit `data-theme` override first, then the system fallback —
   same two-tier shape as collab-web's tokens.css. */
[data-theme="light"] {
    color-scheme: light;
    --bg: oklch(0.985 0.004 307); --bg-raised: oklch(1 0 0);
    --bg-inset: oklch(0.95 0.006 307); --bg-overlay: oklch(0.965 0.006 307);
    --fg: oklch(0.26 0.03 307); --fg-muted: oklch(0.46 0.03 307); --fg-faint: oklch(0.52 0.025 307);
    --accent: oklch(0.62 0.23 341); --accent-muted: oklch(0.62 0.23 341 / 14%);
    --accent-text: oklch(0.55 0.22 341);
    --accent-solid: oklch(0.52 0.21 341);
    --warn-text: oklch(0.47 0.13 85);
    --ok: oklch(0.52 0.13 150); --err: oklch(0.55 0.19 25); --warn: oklch(0.6 0.13 85);
    --link: oklch(0.45 0.09 210);
    --border: oklch(0 0 0 / 10%); --border-strong: oklch(0 0 0 / 15%);
    --ring: oklch(0.58 0.13 230 / 70%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: oklch(0.985 0.004 307); --bg-raised: oklch(1 0 0);
    --bg-inset: oklch(0.95 0.006 307); --bg-overlay: oklch(0.965 0.006 307);
    --fg: oklch(0.26 0.03 307); --fg-muted: oklch(0.46 0.03 307); --fg-faint: oklch(0.52 0.025 307);
    --accent: oklch(0.62 0.23 341); --accent-muted: oklch(0.62 0.23 341 / 14%);
    --accent-text: oklch(0.55 0.22 341);
    --accent-solid: oklch(0.52 0.21 341);
    --warn-text: oklch(0.47 0.13 85);
    --ok: oklch(0.52 0.13 150); --err: oklch(0.55 0.19 25); --warn: oklch(0.6 0.13 85);
    --link: oklch(0.45 0.09 210);
    --border: oklch(0 0 0 / 10%); --border-strong: oklch(0 0 0 / 15%);
    --ring: oklch(0.58 0.13 230 / 70%);
  }
}
:root {
  --hairline: color-mix(in srgb, var(--fg) 10%, transparent);
  --hover-wash: color-mix(in srgb, var(--fg) 5%, transparent);
  /* The error counterpart of `--accent-muted`, derived rather than declared per
     palette so it can only ever be the `--err` that is actually in force. */
  --err-muted: color-mix(in srgb, var(--err) 18%, transparent);
  --radius-card: 8px; --radius-ctl: 6px;
  --line-height: 18px;
  /* Text-entry controls are 16px while everything else stays 12px, and that is
     not a taste call. WebKit zooms the page whenever a control with a computed
     font-size under 16px takes focus, and on iOS it does not zoom back out on
     blur: the layout viewport stays wider than the screen, so the app has to be
     panned sideways for the rest of the visit. `user-scalable=no` and
     `maximum-scale=1` cannot fix it — WebKit ignores both so that pinch-zoom
     always works, which is the right call and the reason the *size* has to be
     the fix. No pointer media query either: an iPad with a trackpad answers
     `pointer: fine` and would zoom anyway, and this surface is phone-first. */
  --input-size: 16px;
  /* 18px is a 1.5 ratio on 12px text; on 16px it is 1.125, which puts the caret
     into the descenders of the line above in a wrapped field. */
  --input-line: 21px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
/* `hidden` must beat the layout display values below. */
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; scrollbar-width: thin;
       scrollbar-color: color-mix(in srgb, var(--fg) 22%, transparent) transparent; }
body {
  height: 100%;
  font: 400 12px/var(--line-height) ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  color: var(--fg); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* Only the fields: a `button` cannot take a focus zoom, and growing the chrome
   with them would cost the dense look for nothing. */
input, select, textarea { font-size: var(--input-size); }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
input, textarea { caret-color: var(--accent); }

/* ── frame ───────────────────────────────────────────────────────────── */
/* `--app-h` is set only while an on-screen keyboard is covering part of the
   screen and the browser did not shrink the layout viewport itself — see
   `applyViewport`. `100dvh` is the better answer the rest of the time.

   `grid-template-columns: minmax(0,1fr)` is what fixes the screen width, and it is
   not decoration. With no explicit column the implicit one is `auto`, which is
   sized to its widest item's *max-content* and is free to exceed a definite
   container: the new-session `<select>` reports the width of its longest option —
   a directory path — so one deep recent path widened the entire shell to 411px on
   a 390px screen. Nothing scrolled inside `main`; the document itself became
   pannable, which on a phone is indistinguishable from a zoom that never came
   back, and `send` ended up past the right edge. A definite column also gives the
   `width: 100%` on that select something real to resolve against. */
#app { display: grid; grid-template-rows: auto minmax(0,1fr) auto; grid-template-columns: minmax(0,1fr); height: var(--app-h, 100dvh); }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--hairline); background: var(--bg);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-weight: 650; letter-spacing: 0.01em; }
.brand .sub { color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* One control scale for the whole app. 44px is the iOS minimum and this surface
   is phone-only, so the pill keeps its dense look while the tap target is a
   thumb's worth of it — the header buttons used to be 26px tall and 6px apart,
   which put `stop` one mis-tap away from navigating out of the session. */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 3px 12px;
  color: var(--fg-muted); background: var(--bg-raised);
  border: 1px solid var(--hairline); border-radius: var(--radius-ctl);
  transition: background .14s ease, color .14s ease, border-color .14s ease;
}
.btn:hover { background: var(--hover-wash); color: var(--fg); border-color: var(--border-strong); }
.btn:active { transform: scale(.97); }
/* `--accent-solid` rather than `--accent`: white-on-accent measured 3.94:1 in the
   light palette, under the 4.5:1 floor for 12px text. */
.btn-accent { color: var(--bg); background: var(--accent-solid); border-color: var(--accent-solid); }
.btn-stop { color: var(--err); }
.btn-go { color: var(--ok); }
/* A disabled control must not keep offering hover and press feedback: the start
   button spends a whole request round trip disabled, which on a phone tunnel is
   exactly when a second tap happens. */
.btn:disabled { opacity: .55; cursor: default; }
.btn:disabled:active { transform: none; }
.btn:disabled:hover { background: var(--bg-raised); color: var(--fg-muted); border-color: var(--hairline); }

main { overflow-y: auto; overscroll-behavior: contain; }
.wrap { max-width: 880px; margin: 0 auto; padding: 10px 12px 16px; }

/* ── session list ────────────────────────────────────────────────────── */
.card {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 8px;
  background: color-mix(in srgb, var(--bg-raised) 60%, var(--bg));
  border: 1px solid var(--hairline); border-radius: var(--radius-card);
  transition: background .14s ease, border-color .14s ease;
}
.card:hover { background: var(--bg-raised); border-color: var(--border-strong); }
.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-name { font-weight: 650; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-cwd { color: var(--fg-faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 4px; font-size: 11px; color: var(--fg-muted); }
.meta .k { color: var(--fg-faint); }
/* The subagent chip, emphasised against its neighbours because on a session that is
   `idle` with agents still running it is the only thing on the card explaining why.
   `.meta .k.ag-run` rather than `.ag-run` alone: `.meta .k` is two selectors and
   would win on specificity, which silently rendered the chip the same faint grey as
   `pid`. */
.meta .k.ag-run { color: var(--accent-text); }
/* Same two-selector reason as `.ag-run` above, and the same accent: an unsent draft
   is the reader's own business on a card that is otherwise all about the agent. */
.meta .k.draft { color: var(--accent-text); }
.empty { padding: 24px 12px; color: var(--fg-faint); text-align: center; }

/* status dot — mirrors the TUI's ● run-state marker */
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-faint); }
.dot.run { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.ask { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* context gauge — the footer bar from the TUI status line */
.gauge { flex: none; width: 54px; height: 4px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; }
.gauge i { display: block; height: 100%; min-width: 2px; background: var(--accent); }

/* markdown tables — box-drawn like the TUI (boxSharp glyphs), so they stay a
   grid instead of reflowing into a web table. Scrolls horizontally rather than
   crushing columns on a narrow screen. */
pre.tbl {
  margin: 8px 0; padding: 0; overflow-x: auto; overscroll-behavior-x: contain;
  background: none; border: 0; border-radius: 0;
  font: inherit; line-height: 1.35; color: var(--fg-muted); white-space: pre;
  -webkit-overflow-scrolling: touch;
}
/* The box-drawn grid only lines up if every glyph shares one advance width, and
   the UA stylesheet gives <code> its own `monospace` family — a different font
   from the body stack, which shears the right border wherever a cell contains
   inline code. Inheriting the family and size is what keeps the table square. */
pre.tbl b, pre.tbl code { font-family: inherit; font-size: inherit; letter-spacing: inherit; }
pre.tbl b { color: var(--fg); font-weight: 650; }
pre.tbl code { padding: 0; background: none; color: var(--link); }

/* working line — the TUI's spinner + intent above the composer, with the live
   thinking trace beneath it. Present only while the agent is actually running. */
.working {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; margin: 8px 0 0;
  border: 1px solid var(--border); border-left: 2px solid var(--accent);
  border-radius: var(--radius-card); background: var(--bg-raised);
}
.working .spin { flex: none; color: var(--accent); width: 1ch; }
.working .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.working .what { color: var(--fg); overflow-wrap: anywhere; }
.working .trace {
  color: var(--fg-faint); font-size: 11px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.working .trace::before { content: "✺ "; color: var(--fg-faint); }

/* card activity line — what each session is doing, in the list view */
.card-act { display: flex; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--fg-muted); }
.card-act .spin { flex: none; color: var(--accent); }
.card-act .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── transcript: TUI cards ───────────────────────────────────────────────
   Mirrors how the terminal draws a turn: assistant prose is bare, a tool call
   is a rounded hairline box with an inline `Output` divider and a dim meta
   footer, thinking is a dim block behind a ✺ marker, and todos are a tree with
   ├ │ └ guides. Glyphs are the same ones omp's unicode symbol preset uses
   (packages/coding-agent/src/modes/theme/theme.ts → UNICODE_SYMBOLS). */
.turn { margin: 10px 0; }
.turn:first-child { margin-top: 0; }

/* user prompt — the TUI's ❯ badge line.
   `pre-wrap` and `overflow-wrap` for the same reason `.think` and `.tool-body`
   carry them: a prompt can be several lines. It could not be until the composer
   became a textarea, so this rendered a pasted stack trace — the input the
   textarea exists for — as one collapsed paragraph, and an unbroken 200-character
   token as ~1600px of horizontal scroll inside the transcript. */
.user-line { color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.user-line::before { content: "❯ "; color: var(--accent-text); }

/* assistant prose — no chrome, like the terminal */
.md { color: var(--fg); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { margin: 12px 0 4px; font-size: 12px; font-weight: 650; color: var(--accent-text); }
.md h1::before { content: "# "; color: var(--fg-faint); font-weight: 400; }
.md h2::before { content: "## "; color: var(--fg-faint); font-weight: 400; }
.md h3::before { content: "### "; color: var(--fg-faint); font-weight: 400; }
.md p { margin: 4px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 0; list-style: none; }
.md li { padding-left: 16px; position: relative; }
.md ul > li::before { content: "•"; position: absolute; left: 4px; color: var(--accent-text); }
.md ol { counter-reset: n; }
.md ol > li { counter-increment: n; }
.md ol > li::before { content: counter(n) "."; position: absolute; left: 0; color: var(--accent-text); }
.md b, .md strong { font-weight: 650; color: var(--fg); }
.md em { font-style: italic; color: var(--fg-muted); }
.md a { color: var(--link); }
.md code { padding: 0 3px; color: var(--link); background: var(--bg-inset); border-radius: 3px; }
.md hr { margin: 8px 0; border: 0; border-top: 1px solid var(--hairline); }
.md blockquote { margin: 4px 0; padding-left: 9px; border-left: 2px solid var(--hairline); color: var(--fg-muted); }
.md pre {
  margin: 6px 0; padding: 8px 10px; overflow-x: auto;
  background: var(--bg-inset); border: 1px solid var(--hairline); border-radius: var(--radius-card);
}
.md pre code { padding: 0; background: none; color: var(--fg); }

/* tool call — the rounded box the TUI draws around every action */
.tool {
  border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  border-radius: var(--radius-card); overflow: hidden;
}
.tool.err { border-color: color-mix(in srgb, var(--err) 45%, transparent); }
.tool-head { padding: 6px 10px; color: var(--fg); overflow-wrap: anywhere; }
.tool-head .sigil { color: var(--accent-text); }
.tool-head .arg { color: var(--fg-muted); }
/* the `├─ Output ───┤` divider, as a rule with an inline label */
.tool-div {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px; color: var(--fg-faint); font-size: 11px;
}
.tool-div::after { content: ""; flex: 1; border-top: 1px solid var(--hairline); }
.tool-body { padding: 4px 10px 6px; color: var(--fg-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.tool-body.clip { max-height: 168px; overflow: hidden; }
.tool-more { padding: 0 10px; color: var(--fg-faint); font-size: 11px; }
/* The last control under the 44px floor: it reveals the rest of a tool's output,
   which on a phone is a thing people reach for mid-turn. */
.tool-more button {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
  color: var(--link); text-decoration: underline;
}

/* thinking — dim, behind the ✺ marker the TUI uses */
.think { color: var(--fg-faint); white-space: pre-wrap; overflow-wrap: anywhere; }
.think::before { content: "✺ "; color: var(--fg-muted); }

/* ── tree panels: todos and subagents ────────────────────────────────────
   Both draw omp's ├/└ guides, and both are built from the same row primitive: a
   fixed guide gutter plus a content column that owns its own wrapping. That
   structure is the whole reason a row survives a 390px content column. Without it
   the guide is an inline sibling of the text, so a wrapped line returns to column 0
   — outside the tree, reading as a new item rather than a continuation — an
   unbreakable token runs off the viewport and makes the whole transcript scroll
   sideways, and `overflow`/`text-overflow` are inert, because neither applies to a
   non-replaced inline element. The todos panel had all three problems and pushed
   ~100px of horizontal scroll into `main` at phone width; it shares the fix. */
.tree-row { display: flex; }
.tree-row > .guide { flex: none; }
.tree-body { min-width: 0; flex: 1; }
/* `pre` is load-bearing too: a guide is literal box-drawing characters padded with
   spaces to a fixed column, and HTML collapses runs of whitespace and strips it at
   line ends. Without it the indent silently loses columns — the todos tree rendered
   4 where 5 were written, and a subagent continuation collapsed to 2 columns, or to
   none at all on the last row. */
.guide { color: var(--fg-faint); white-space: pre; }

/* todos — strikethrough completions over the shared tree */
.todos { margin: 10px 0; }
/* Same min-height as the subagents header, which is a button: a 14px difference
   between two adjacent panel headers reads as inconsistent spacing, not affordance. */
.todos-h { display: flex; align-items: center; min-height: 32px; font-weight: 650; color: var(--accent-text); }
.todos-h .count { color: var(--fg-faint); font-weight: 400; }
.phase { color: var(--fg); font-weight: 650; overflow-wrap: anywhere; }
.phase .count { color: var(--fg-faint); font-weight: 400; }
.task { color: var(--fg-faint); overflow-wrap: anywhere; }
.task.now { color: var(--fg); }
.task.done { color: var(--ok); text-decoration: line-through; }
.task.blocked { color: var(--warn-text); }

/* subagents — the TUI's anchored "Subagents" HUD, over the shared tree row above.
   Same idiom as the todos panel directly above it (accent header with a dim count,
   ├/└ guides), because in the terminal these two blocks are deliberately the same
   shape and a phone that drew them differently would imply a difference that is not
   there. */
.agents { margin: 10px 0; }
/* A control, not a heading: the panel is up to ~470px tall at the row cap, sitting
   directly above the composer for as long as a fan-out runs. 32px rather than the
   44px floor `.btn` and the approval options use — a mis-tapped collapse costs one
   tap to undo, and 44px would spend the vertical budget the collapse exists to
   reclaim. */
.agents-h {
  display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px;
  text-align: left; font-weight: 650; color: var(--accent-text);
}
.agents-h .count { color: var(--fg-faint); font-weight: 400; }
/* Immediately after the count, not pushed to the far edge: a 7px triangle stranded
   200px away from the label does not read as a disclosure control. */
.agents-h .caret { color: var(--fg-faint); font-weight: 400; }
.agents-h .bad { color: var(--err); }
/* One cell, centred, plus its own trailing column: the status glyphs do not share an
   advance width (⟳ is 1.10ch, ✔ is 0.97ch), so an unpinned glyph left the id column
   ragged and shifted every continuation indent by a fraction. `margin-right` because
   the flex row eats the literal space the markup used to carry — without it the glyph
   touched the first letter of the id (`⟳InstallPlanAudit`) and the id started at 3ch
   while the continuation guide indents 4ch. Pinning also survives a user theme that
   overrides the symbol preset. */
.ag-st { flex: none; display: inline-block; width: 1ch; margin-right: 1ch; text-align: center; }
/* `--accent-text`, not `--accent`: this is a 12px glyph on the page background, and
   `--accent` measures 3.94:1 there in the light palette — under the 4.5:1 floor,
   the exact trap the `--warn`/`--warn-text` split above exists to prevent. */
.ag-run { color: var(--accent-text); }
.ag-ok { color: var(--ok); }
.ag-err { color: var(--err); }
/* Aborted is an interruption, not a failure, and sharing red with `failed` left
   that pair distinguished by a 12px glyph alone. */
.ag-stop { color: var(--warn-text); }
.ag-off { color: var(--fg-faint); }
/* Live work carries the emphasis; a FINISHED row recedes. Parked is deliberately not
   in that set: the session is disposed but revivable, often waiting on its parent, so
   dimming it to match a completed agent overstated how done it was. */
.ag-id { color: var(--accent-text); font-weight: 650; overflow-wrap: anywhere; }
.ag-done .ag-id { color: var(--fg-muted); font-weight: 400; }
.ag-meta { color: var(--fg-faint); font-weight: 400; overflow-wrap: anywhere; }
/* The budget split between the two continuation lines follows which one changes. The
   assignment is static context you read once, so one ellipsized line; the live tool is
   why the panel exists and is the signal that an agent is stuck, so it gets the
   two-line clamp. (The reverse — which is what shipped first — truncated a real
   `bash sleep 75; cd … && pnpm` at 48 characters while the label below it spent two
   full lines.) */
.ag-task {
  display: block; color: var(--fg-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ag-what {
  color: var(--fg-faint); overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ag-more { color: var(--fg-faint); }
/* Screen-reader-only text. The status is otherwise a glyph plus a colour, which
   announces as an unlabeled symbol or not at all — and this is the block that
   changes most often. */
.sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* ── ask / approval prompt ───────────────────────────────────────────── */
#ask {
  margin: 0 0 10px; padding: 10px 12px;
  background: var(--bg-raised);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-radius: var(--radius-card);
}
/* `--warn-text`, not `--warn`: this is the highest-stakes sentence in the app and
   it is 12px text, where the dot/border colour does not carry enough contrast. */
#ask .q { color: var(--warn-text); font-weight: 650; margin-bottom: 8px; }
/* Same 44px floor as `.btn`: these authorise a tool call, and a mis-tap here —
   "yes, and don't ask again" is one row from "no" — is not recoverable the way a
   mis-tapped stop is. */
#ask .opt {
  display: flex; align-items: center; gap: 6px; min-height: 44px; width: 100%;
  text-align: left; padding: 6px 10px; margin-top: 6px;
  background: var(--bg); border: 1px solid var(--hairline); border-radius: var(--radius-ctl);
}
#ask .opt:hover { background: var(--hover-wash); border-color: var(--border-strong); }
/* No trailing space in the glyph: a flex item trims it, which collided the chevron
   with the label. The gap above does that job instead. */
#ask .opt::before { content: "›"; color: var(--accent-text); }
.ask-err { margin-top: 8px; font-size: 11px; color: var(--err); }

/* ── new-session form ────────────────────────────────────────────────── */
#newform {
  padding: 10px 12px; margin-bottom: 8px;
  background: color-mix(in srgb, var(--bg-raised) 60%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  border-radius: var(--radius-card);
}
.nf-title { font-weight: 650; color: var(--fg); margin-bottom: 8px; }
.nf-field { display: grid; gap: 4px; margin-top: 8px; }
/* `--fg-muted`, not `--fg-faint`: these are the form's only labels, and at 11px
   faint measured 3.55:1 — structure the user needs, below the contrast floor. */
.nf-field > span { color: var(--fg-muted); font-size: 11px; }
.nf-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
#newsuggest, #newdir {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px;
  background: var(--bg-inset); border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl); color: var(--fg);
}
/* Room for the UA's own chevron, which a long clipped label otherwise runs under. */
#newsuggest { appearance: auto; padding-right: 28px; }
#newdir::placeholder { color: var(--fg-faint); }
/* The primary needs to be the wider of the two: `cancel` is the longer word and
   would otherwise be the physically larger button. */
.nf-actions .btn-accent { min-width: 96px; }
/* Its own line, and wrapping: sharing the button row truncated the one message
   that matters after committing ("started — the session appear…"). */
.nf-status { margin-top: 8px; font-size: 11px; color: var(--fg-muted); }
.nf-status.err { color: var(--err); }

/* Interruption marker in the transcript's own idiom (same hairline rule as a
   tool's `Output` divider). Without it an aborted turn left no trace at all: a
   prompt with no answer read as the agent ignoring the user, and a resumed turn
   ran straight on from the truncated one with no boundary. */
.stopped {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 0; color: var(--warn-text); font-size: 11px;
}
.stopped::after { content: ""; flex: 1; border-top: 1px solid var(--hairline); }
/* A prompt another participant sent, named so it does not read as the phone's own. */
.user-from { color: var(--fg-faint); }

/* ── composer ────────────────────────────────────────────────────────── */
footer {
  padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--hairline); background: var(--bg);
}
/* An open keyboard covers the home indicator, so reserving its inset as well
   floats the composer a third of an inch above the keys for no reason. `.kb` is
   set from the visual viewport, the only place that knows. */
body.kb footer { padding-bottom: 8px; }
/* Same 880px column as `.wrap`, so the input lines up with the transcript.
   `flex-end` rather than `center`: the field grows with its content, and send and
   stop belong beside its last line instead of floating at its middle. */
footer .wrap { display: flex; gap: 8px; align-items: flex-end; padding: 0; }
/* Past `COMPACT_ROWS` rows the field takes the whole width and the buttons wrap
   under it. Sharing the row with them costs the field 160px — two 72px buttons and
   the two 8px gaps around them, none of which shrink, since `stop` and `send` hold
   their slots whether or not a turn is running. (The sigil and its own gap are the
   other 20px of the row, and are paid in both layouts, which is what the basis
   below reserves.) That leaves the field 16 characters a line at 390px and 15 at
   375px, so the five-row cap showed about 80 characters in total and an ordinary
   two-sentence steer already scrolled. Full width doubles it to 33 at 390px.

   It costs 52px of transcript at a given row count — the wrapped button line is a
   44px control plus the 8px gap — but the wide field needs fewer rows for the same
   text, so what it actually costs is much less than that and varies with length:
   11px at the first length that engages it, where the wide field needs one row
   against three, and 31px across the band above that, where it needs two against
   three. Further up the two converge to about 10px, and between 65 and 66
   characters the wide layout is briefly the cheaper of the two.
   `send` does not move: the composer is anchored to the bottom, so it grows upward
   and the buttons stay where the thumb left them. `syncComposer` owns the class and
   re-derives it from the text on every sync — see the reference-geometry note. */
footer .wrap.grown { flex-wrap: wrap; }
/* The 20px this reserves is the sigil's pinned width plus the row gap. Pinned
   because the reserve is arithmetic: the glyph's natural advance is 9.6-9.9px
   depending on which mono face the platform resolves, so there were about 2px of
   slack, and past it the field no longer fits beside the sigil and drops to a flex
   line of its own — a silently three-row composer. */
footer .wrap.grown .field { flex: 1 1 calc(100% - 20px); }
footer .wrap.grown #turn { margin-left: auto; }
/* Pinned to the field's *first* line, sharing its size and line box so the glyph
   reads as the prompt leading that line rather than a chevron in the margin: same
   `--input-size`, same line height, and a padding-top equal to the field's border
   plus its padding. At 12px against 16px text its baseline sat 1.2px high. */
.prompt {
  color: var(--accent-text); flex: none; align-self: flex-start; width: 12px;
  font-size: var(--input-size); line-height: var(--input-line); padding-top: 11px;
  cursor: text;
}
/* A textarea, not a single-line input: a steer is regularly a paragraph or a
   pasted stack trace, and a one-line field showed a ~30-character window onto it
   with no way to see or fix what had already been typed. It grows from one row to
   five and then scrolls, so the transcript keeps the screen in the common case.

   The chrome lives on `.field` and only the text lives in the textarea, which is
   not tidiness: with the padding on the textarea the content scrolled *under* it,
   so at the cap a sixth line showed as a slice through its x-height flush against
   the rounded border — reading as clipping rather than as more below. With the
   padding outside the scrollport the cap is exactly five line boxes and the sixth
   line is cleanly outside it. It also makes the height arithmetic honest: the
   textarea has no padding or border, so its `scrollHeight` *is* the height to set.

   One row is the 44px the rest of the row's controls use: 21px line + 20px padding
   + 2px border is 43, and `min-height` supplies the last pixel. */
.field {
  flex: 1; min-width: 0; display: flex; min-height: 44px; padding: 10px 8px;
  background: var(--bg-inset); border: 1px solid var(--hairline);
  border-radius: var(--radius-ctl); cursor: text;
}
/* The field's only focus cue used to be the shared `--ring`, which measures 2.57:1
   against the light background — under WCAG 1.4.11's 3:1 for a focus indicator.
   This is the treatment `loginPage()` already uses, and its accent border measures
   5.87:1. Applying it to the container rather than the textarea is what keeps the
   ring outside the text. */
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
/* A steer the portal could not deliver: the text is put back in the field, the line
   at the end of the transcript names the failure, and the border says which control
   it belongs to. The halo goes with the border, because this is the *normal* look of
   a failure rather than an edge case — tapping `send` on iOS does not blur the
   textarea, so the field is still focused when the failure paints, and the accent
   halo drew a pink wash around a red ring. */
.field.err { border-color: var(--err); }
.field.err:focus-within { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-muted); }
#msg {
  flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: var(--fg);
  line-height: var(--input-line); max-height: calc(var(--input-line) * 5);
  resize: none; overflow-y: hidden; overflow-wrap: anywhere;
}
/* The container carries focus for both of them. */
#msg:focus-visible { outline: none; }
#msg::placeholder { color: var(--fg-faint); }
/* Stop and resume are two states of one control, so they share one fixed slot: the
   row's geometry cannot shift under a thumb that is already reaching for it. `send`
   shares that width because the pair reads as a pair, and because an 84px `stop`
   beside a 56px `send` made the secondary control the largest thing in the row —
   the inversion `.nf-actions .btn-accent` exists to prevent in the other form.
   72px holds `resume`, the longest label either takes, at its 70.5px natural width.
   It is deliberately tight: this rule and `.prompt`'s `font-size` are the two things
   that own the placeholder's width budget, and at 76px both placeholders wrapped and
   clipped on a 375px screen. Change either one and re-measure the copy. */
#turn, #send { flex: none; min-width: 72px; }

@media (max-width: 640px) {
  .wrap { padding: 8px 10px 14px; }
  .card-cwd { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>omp</b><span class="sub" id="sub">sessions</span></div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="back" hidden>← all</button>
      <button class="btn" id="new" aria-expanded="false" aria-controls="newform">+ new</button>
    </div>
  </header>
  <main><div class="wrap"><div id="newform" hidden>
    <div class="nf-title">start a new session</div>
    <label class="nf-field">
      <span>directory</span>
      <select id="newsuggest"><option value="">loading…</option></select>
    </label>
    <label class="nf-field" id="newdirfield" hidden>
      <span>path</span>
      <input id="newdir" placeholder="~/ or an absolute path" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <div class="nf-row nf-actions">
      <button class="btn btn-accent" id="start">start</button>
      <button class="btn" id="cancelnew">cancel</button>
    </div>
    <div class="nf-status" id="newstatus" role="status" aria-live="polite"></div>
  </div><div id="list"></div><div id="detail" hidden><div id="ask" role="group" aria-live="assertive" hidden></div><div id="log"></div><div id="todos"></div><div id="subagents"></div><div id="working" class="working" hidden></div><!--
    A steer the portal could not deliver. In the scroll area rather than the
    composer, and that placement is the whole reason it exists: as a footer row it
    would cost the composer 26px of a 375px screen, here it costs nothing — it
    occupies space that already scrolls and scrolls away with the transcript. It is
    the same `.ask-err` line, with the same words, that a rejected `ask` answer
    already gets 40 lines up in this file. The red border alone says "something";
    it cannot say which something, and a restored draft is indistinguishable from
    one that was never sent.
  --><div id="sendfail" class="ask-err" role="status" hidden>could not send that steer — try again</div></div></div></main>
  <footer id="composer" hidden>
    <div class="wrap">
      <!-- Decorative: the field carries its own name, and unhidden this glyph was
           announced ahead of it. Tapping it focuses the field, so the 27px strip at
           the screen's left edge is not dead to a thumb. -->
      <span class="prompt" aria-hidden="true">›</span>
      <!-- `aria-label` because the placeholder is the only other name this field has
           and it both disappears on the first keystroke and changes between the
           empty-session and ongoing-session states.
           `enterkeyhint` is corrected at runtime: Enter is a newline on a soft
           keyboard and send on a hardware one. -->
      <div class="field"><textarea id="msg" rows="1" aria-label="steer this session" placeholder="steer the agent" enterkeyhint="enter" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
      <!-- No `hidden` attribute: this slot is hidden with `visibility` so the row's
           geometry never depends on turn state, and `[hidden]`'s
           `display:none !important` would win over that and blank the control in
           every state. `renderTurnControl` owns its visibility from the first frame. -->
      <button class="btn btn-stop" id="turn" style="visibility:hidden" title="stop the current turn — the session stays open">stop</button>
      <button class="btn btn-accent" id="send">send</button>
    </div>
  </footer>
</div>
<script>
// `?theme=light|dark` pins the palette; otherwise the OS preference decides.
const pinned = new URLSearchParams(location.search).get("theme");
if (pinned === "light" || pinned === "dark") document.documentElement.dataset.theme = pinned;

const $ = id => document.getElementById(id);
/* Quotes matter as much as angle brackets here: several of these strings land in
   attribute position, and everything this renders — assistant prose, tool output,
   approval labels, ids off the wire — is content the agent produced or fetched. An
   unescaped `"` in a markdown link target was enough to add a `style` attribute and
   float one link over the whole viewport, so every tap hit it instead of stop. */
const ESCAPES = { "<": "&lt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s).replace(/[<&"']/g, c => ESCAPES[c]);

/* Plain-text width of an inline-markdown cell. Column widths must be measured
   on what the eye sees, not on the markup, or every bold cell over-pads. */
const plain = t =>
  String(t)
    .replace(/\[([^\]]+)\]\((?:https?:[^)\s]+)\)/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\*([^*\n]+)\*/g, "$1");

/* Split a table row on unescaped pipes, dropping the leading/trailing ones. */
const splitRow = line =>
  line
    .trim()
    .replace(/^\|/, "")
    .replace(/\|$/, "")
    .split(/(?<!\\)\|/)
    .map(c => c.trim().replace(/\\\|/g, "|"));

/* Greedy wrap on word boundaries, matching how the TUI wraps a table cell. */
function wrapCell(text, width) {
  const words = plain(text).split(/\s+/).filter(Boolean);
  if (!words.length) return [""];
  const lines = [];
  let cur = "";
  for (const w of words) {
    if (!cur) cur = w;
    else if (cur.length + 1 + w.length <= width) cur += ` ${w}`;
    else { lines.push(cur); cur = w; }
    while (cur.length > width) { lines.push(cur.slice(0, width)); cur = cur.slice(width); }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* Widest column we will render before wrapping. Wide enough for a real sentence,
   narrow enough that a three-column table still fits a phone without scrolling. */
const MAX_COL = 34;

/* Render a GFM table as a box-drawn terminal table, using the same glyphs and
   layout as omp's TUI (`boxSharp`: bordered, header separated by a tee row).
   HTML <table> would reflow into something that reads nothing like the terminal,
   so this emits a monospace block and lets it scroll horizontally instead. */
function renderTable(header, aligns, rows, inline) {
  const cols = header.length;
  const widths = [];
  for (let c = 0; c < cols; c++) {
    const cells = [header[c], ...rows.map(r => r[c] ?? "")];
    const longestWord = Math.max(...cells.flatMap(x => plain(x).split(/\s+/).map(w => w.length)), 1);
    const widest = Math.max(...cells.map(x => plain(x).length), 1);
    // Never wrap tighter than the longest single word: mid-word breaks are worse
    // than a slightly wider column.
    widths.push(Math.max(Math.min(widest, MAX_COL), Math.min(longestWord, MAX_COL)));
  }

  const pad = (text, w, align) => {
    const slack = Math.max(0, w - plain(text).length);
    const left = align === "right" ? slack : align === "center" ? Math.floor(slack / 2) : 0;
    return " ".repeat(left) + inline(text) + " ".repeat(slack - left);
  };
  const line = (l, mid, r) => l + widths.map(w => "─".repeat(w + 2)).join(mid) + r;
  const body = (cells, bold) => {
    const wrapped = cells.map((cell, c) => wrapCell(cell, widths[c]));
    const height = Math.max(...wrapped.map(w => w.length));
    const out = [];
    for (let i = 0; i < height; i++) {
      const parts = wrapped.map((w, c) => {
        // Only the first visual line carries inline markup; continuation lines are
        // already plain text from the wrapper.
        const raw = w[i] ?? "";
        const cell = i === 0 && w.length === 1 ? cells[c] : raw;
        const rendered = pad(cell, widths[c], aligns[c]);
        return bold ? `<b>${rendered}</b>` : rendered;
      });
      out.push(`│ ${parts.join(" │ ")} │`);
    }
    return out;
  };
  const html = [
    line("┌", "┬", "┐"),
    ...body(header, true),
    line("├", "┼", "┤"),
    ...rows.flatMap(r => body(header.map((_, c) => r[c] ?? ""), false)),
    line("└", "┴", "┘"),
  ].join("\n");
  return `<pre class="tbl">${html}</pre>`;
}

/* Small markdown renderer covering what agents actually emit. Deliberately not
   a full parser: headings, lists, quotes, rules, fenced/inline code, bold and
   italic — styled to read like the terminal rather than like a web page. */
function md(src) {
  const out = [];
  const lines = String(src).split("\n");
  let list = null, para = [], fence = null, code = [];
  const inline = t =>
    esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      // No quotes in the URL group: belt and braces with `esc`, so a link cannot
      // carry an attribute even if this string reaches here unescaped later.
      .replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const flush = () => { flushPara(); flushList(); };

  for (let li = 0; li < lines.length; li++) {
    const raw = lines[li];
    const line = raw.replace(/\s+$/, "");
    const fenceMark = /^\s*```(\w*)\s*$/.exec(line);
    if (fence !== null) {
      if (fenceMark) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); fence = null; code = []; }
      else code.push(raw);
      continue;
    }
    if (fenceMark) { flush(); fence = fenceMark[1] || ""; continue; }
    if (!line.trim()) { flush(); continue; }
    // GFM table: a header row immediately followed by a delimiter row. Checked
    // before the horizontal-rule and list branches, whose patterns a delimiter
    // row like `|---|---|` would otherwise partially match.
    if (line.includes("|") && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[li + 1] ?? "") && (lines[li + 1] ?? "").includes("|")) {
      const header = splitRow(line);
      const delim = splitRow(lines[li + 1]);
      if (delim.length === header.length && delim.every(d => /^:?-+:?$/.test(d))) {
        flush();
        const aligns = delim.map(d =>
          d.startsWith(":") && d.endsWith(":") ? "center" : d.endsWith(":") ? "right" : "left",
        );
        const rows = [];
        li += 2;
        while (li < lines.length && lines[li].includes("|") && lines[li].trim()) {
          rows.push(splitRow(lines[li]));
          li++;
        }
        li--; // the loop's own increment consumes the terminating line
        out.push(renderTable(header, aligns, rows, inline));
        continue;
      }
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flush(); out.push("<hr>"); continue; }
    const q = /^>\s?(.*)$/.exec(line);
    if (q) { flush(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }
    const ul = /^\s*[-*+]\s+(.*)$/.exec(line);
    const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul ?? ol)[1]);
      continue;
    }
    flushList();
    para.push(line.trim());
  }
  if (fence !== null && code.length) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("");
}

/* One-line argument summary, the way the TUI titles a tool card. */
const TOOL_ARG = { read: "path", write: "path", edit: "path", bash: "command", glob: "path", grep: "pattern", task: "task", todo: "op", web_search: "query" };
function toolTitle(item) {
  const key = TOOL_ARG[item.name];
  const raw = key ? item.args?.[key] : undefined;
  const arg = typeof raw === "string" ? raw : "";
  const label = item.name === "bash" ? "$" : `• ${item.name}`;
  return { label, arg: arg.length > 160 ? `${arg.slice(0, 160)}…` : arg };
}

const TODO_GLYPH = { pending: "☐", in_progress: "◐", completed: "☑", abandoned: "☒", blocked: "⚠" };

function renderTodos(phases) {
  if (!phases?.length) return "";
  const all = phases.flatMap(p => p.tasks);
  const done = all.filter(t => t.status === "completed").length;
  const rows = phases.map((p, pi) => {
    const last = pi === phases.length - 1;
    const pdone = p.tasks.filter(t => t.status === "completed").length;
    // `.tree-row`/`.tree-body` and the `aria-hidden` guide are shared with the
    // subagents panel below: without them a long task wrapped back to column 0 and an
    // unbreakable one scrolled the whole transcript sideways, and a screen reader read
    // the box-drawing characters aloud once per line.
    const head =
      `<div class="tree-row"><span class="guide" aria-hidden="true">${last ? "└" : "├"} </span>` +
      `<span class="tree-body phase">${esc(p.name)}<span class="count"> · ${pdone}/${p.tasks.length}</span></span></div>`;
    const tasks = p.tasks.map((t, ti) => {
      const cls = t.status === "completed" ? "done" : t.status === "in_progress" ? "now" : t.status === "blocked" ? "blocked" : "";
      const branch = ti === p.tasks.length - 1 ? "└" : "├";
      return (
        `<div class="tree-row"><span class="guide" aria-hidden="true">${last ? "  " : "│ "} ${branch} </span>` +
        `<span class="tree-body task ${cls}">${TODO_GLYPH[t.status] ?? "☐"} ${esc(t.content)}</span></div>`
      );
    }).join("");
    return head + tasks;
  }).join("");
  return `<div class="todos"><div class="todos-h">Todos<span class="count"> · ${done}/${all.length}</span></div>${rows}</div>`;
}

/* Status glyph and colour per subagent. Glyphs come from omp's own unicode preset
   (theme.ts → UNICODE_SYMBOLS) so a row reads the same as the Agent Hub row for the
   same agent, with two deliberate departures, both because a 12px glyph has to differ
   in SHAPE and not only in hue: `parked` is `⏸` rather than the preset's `○` or
   `⦸`, which are the same ring as `⟳` for opposite meanings; and `aborted` is the `⨯`
   this app already marks a stopped turn with rather than `status.aborted`'s `⏹`, which
   renders from a fallback face as a solid block foreign to the surrounding line art.
   `idle` means the registry released the agent without a lifecycle verdict ever
   arriving — done, but not known to have succeeded. */
const AGENT_STATE = {
  running:   { glyph: "⟳", cls: "ag-run" },
  completed: { glyph: "✔", cls: "ag-ok" },
  failed:    { glyph: "✘", cls: "ag-err" },
  aborted:   { glyph: "⨯", cls: "ag-stop" },
  parked:    { glyph: "⏸", cls: "ag-off" },
  idle:      { glyph: "•", cls: "ag-off" },
};
/* An unrecognised status from a newer host must not masquerade as a state we know:
   falling back to the `idle` bullet made "we have no idea" indistinguishable from
   "finished, verdict unknown". `hasOwn` because a status of `constructor` would
   otherwise resolve through Object.prototype and skip the fallback entirely. */
const agentStateOf = status =>
  Object.hasOwn(AGENT_STATE, status) ? AGENT_STATE[status] : { glyph: "?", cls: "ag-off" };

/* Elapsed time for a subagent. Separate from `ageOf`: subagents live for seconds
   to minutes, and "just now" — the right answer for a session card — flattens the
   whole range that matters here. `durationMs` is preferred when the host sent it
   because it is computed host-side, so it carries no clock skew and freezes at the
   right value when the agent stops. Minutes are kept past the hour: a bare `1h`
   covered everything from 60 to 119 minutes, which is exactly the range where the
   number is the reason you would go look at a possibly-stuck agent. */
function elapsedOf(a) {
  // The one number on the row with no other guard: with neither field, `Date.now() -
  // undefined` is NaN, every comparison below is false, and the row printed `NaNh`.
  // An empty string drops out of the `.filter(Boolean)` join like every other field.
  const ms = Number.isFinite(a.durationMs) ? a.durationMs : Date.now() - a.startedAt;
  if (!Number.isFinite(ms)) return "";
  const secs = Math.max(0, Math.round(ms / 1000));
  if (secs < 60) return `${secs}s`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m`;
  const rem = mins % 60;
  return `${Math.floor(mins / 60)}h${rem ? `${rem}m` : ""}`;
}

/* `12.3k` / `1.2M`, the TUI's token shorthand. A phone row cannot spend 7 columns
   on a raw integer. */
function tokensOf(n) {
  if (!Number.isFinite(n) || n <= 0) return "";
  if (n < 1000) return String(n);
  return n < 1e6 ? `${(n / 1000).toFixed(1)}k` : `${(n / 1e6).toFixed(1)}M`;
}

/* Spend per agent. Rounded to the cent it is worth reading and no further: a
   fan-out is the most expensive thing this app can show you, and the raw float
   the host sends (`1.116988`) is nine characters of noise on a phone row. */
function costOf(n) {
  return Number.isFinite(n) && n >= 0.01 ? `$${n.toFixed(2)}` : "";
}

/* Whether the panel is expanded. `null` follows the size-based default below; a tap
   pins it either way for as long as the session stays open, the same lifetime
   `expandedTools` has. */
let agentsOpen = null;
/* Above this many rows the panel is collapsed until asked for. At the row cap with
   continuation lines it is ~470px tall directly above the composer, and it stays
   that way for as long as the fan-out runs — which is exactly when the transcript
   underneath it is worth reading. The header carries the counts, so a collapsed
   panel still answers "how many". */
const AGENTS_AUTO_COLLAPSE_OVER = 4;

/* The Subagents panel: the TUI HUD's `Id: description` rows, plus the live tool call
   underneath because the phone has no Agent Hub to open for it. Returns "" when the
   session has spawned nothing, so the panel is absent rather than an empty header —
   the same contract `renderTodos` has. */
function renderSubagents(s) {
  const rows = s?.rows ?? [];
  if (!rows.length) return "";
  // `total` counts every agent the projection kept and `rows` is capped, so the
  // header can say how many the cap is hiding rather than truncating silently.
  const total = s.total ?? rows.length;
  const hidden = Math.max(0, total - rows.length);
  // `N/M running`, the ratio grammar the todos header already uses, rather than prose
  // — it is shorter and always states both numbers. Every other count comes from the
  // projection, NOT from `rows`, which is capped: subtracting a capped failure count
  // from an uncapped total reported "11 done · 1 failed" for a twelve-agent fan-out
  // whose other four outcomes never reached the phone.
  //
  // A failure and the running total are stated TOGETHER, because the panel's default
  // state past four rows is collapsed and the header is then the whole panel: reporting
  // a failure only once everything had stopped withheld the one thing worth looking at
  // for exactly as long as it was actionable. Spend rides along for the same reason.
  const bad = s.failed ?? 0;
  const held = s.parked ?? 0;
  const spend = costOf(s.cost);
  const badPart = bad ? ` · <span class="bad">${bad} failed</span>` : "";
  const settled = [
    `${Math.max(0, total - bad - held)} done`,
    held ? `${held} parked` : "",
  ].filter(Boolean).join(" · ");
  const head = s.running
    ? `${s.running}/${total} running${badPart}`
    : bad || held
      ? `${settled}${badPart}`
      : `${total} done`;
  const open = agentsOpen ?? rows.length <= AGENTS_AUTO_COLLAPSE_OVER;
  // `aria-controls` only while the list exists: pointing it at a missing id is worst
  // exactly when collapsed, which is when a client would follow it. The caret is
  // decorative — `aria-expanded` already carries the state, and an unlabelled triangle
  // announces as its Unicode name.
  const header =
    `<button class="agents-h" id="agtoggle" aria-expanded="${open}"${open ? ' aria-controls="aglist"' : ""}>` +
    `Subagents<span class="count"> · ${head}${spend ? ` · ${spend}` : ""}</span>` +
    `<span class="caret" aria-hidden="true">${open ? "▾" : "▸"}</span></button>`;
  if (!open) return `<div class="agents">${header}</div>`;
  const body = rows.map((a, i) => {
    const last = i === rows.length - 1 && !hidden;
    const state = agentStateOf(a.status);
    // Continuation lines are indented under the id, with the trunk drawn only while
    // more rows follow. Four columns because that is where the id starts: two for the
    // branch and its space, two for the pinned glyph cell and its trailing column.
    const cont = `<span class="guide" aria-hidden="true">${last ? "    " : "│   "}</span>`;
    // `task` is the generic worker's display name, so it names nothing here and
    // collides with the assignment label below; the specific types (`scout`,
    // `reviewer`) are worth the slot. Cost sits second because it is the field most
    // worth reading and the last one an overflow would drop.
    const kind = a.agent && a.agent !== "task" ? a.agent : "";
    const meta = [kind, costOf(a.cost), elapsedOf(a)].filter(Boolean).join(" · ");
    const tokens = tokensOf(a.tokens);
    const volume = [tokens ? `${tokens} tok` : "", a.tools ? `${a.tools} tool${a.tools === 1 ? "" : "s"}` : ""]
      .filter(Boolean)
      .join(" · ");
    // `ag-done` dims the id, so parked stays out of it: the session is disposed but
    // revivable, which is not the same as finished.
    const spent = a.status !== "running" && a.status !== "parked" ? " ag-done" : "";
    const id =
      `<div class="tree-row${spent}"><span class="guide" aria-hidden="true">${last ? "└ " : "├ "}</span>` +
      `<span class="ag-st ${state.cls}" aria-hidden="true">${state.glyph}</span>` +
      `<span class="sr">${esc(a.status)} </span>` +
      `<span class="tree-body"><span class="ag-id">${esc(a.id)}</span>` +
      (meta ? ` <span class="ag-meta">${esc(meta)}</span>` : "") +
      `</span></div>`;
    const task = a.task ? `<div class="tree-row">${cont}<span class="tree-body ag-task">${esc(a.task)}</span></div>` : "";
    // A running agent has a "right now"; a finished one's last tool is history and
    // would read as though it were still working, so its row shows what the run cost
    // instead. One slot either way, and not an unconditional one: a running agent that
    // has not reported a tool yet, or a finished one whose lifecycle arrived with no
    // progress detail, has neither — and with no label either, that row is one line.
    const tail = a.status === "running" ? (a.intent ? `• ${a.intent}` : "") : volume;
    const what = tail ? `<div class="tree-row">${cont}<span class="tree-body ag-what">${esc(tail)}</span></div>` : "";
    // One list item per AGENT, not per line: the 1-3 rows below belong together, and a
    // flat run of divs gave assistive tech no count and no way to step agent by agent.
    return `<div role="listitem">${id}${task}${what}</div>`;
  }).join("");
  // Structurally an agent row, ellipsis in the glyph cell, so the truncation notice
  // lands on the same column as every id instead of two columns to its left.
  const more = hidden
    ? `<div role="listitem" class="tree-row"><span class="guide" aria-hidden="true">└ </span>` +
      `<span class="ag-st ag-off" aria-hidden="true">…</span>` +
      `<span class="tree-body ag-more">${hidden} more</span></div>`
    : "";
  return `<div class="agents">${header}<div id="aglist" role="list">${body}${more}</div></div>`;
}

/* Tool outputs the user expanded. The transcript is re-rendered wholesale on every
   frame, so an expansion that lived only as a removed class disappeared on the
   next token — unusable exactly while a turn is running, which is when someone
   wants to read what the agent is doing. Keyed by tool call id, not by index, so
   the set survives cards falling off the front of the cap. */
let expandedTools = new Set();

function renderTranscript(items) {
  return items.map((it, i) => {
    if (it.kind === "user") {
      // `from` is only set for a prompt another participant sent, so an unnamed
      // card is unambiguously this phone's own.
      const who = it.from ? `<span class="user-from">${esc(it.from)} </span>` : "";
      return `<div class="turn"><div class="user-line">${who}${esc(it.text)}</div></div>`;
    }
    if (it.kind === "assistant") return `<div class="turn"><div class="md">${md(it.text)}</div></div>`;
    if (it.kind === "thinking") return `<div class="turn"><div class="think">${esc(it.text)}</div></div>`;
    // The seam where a turn was cut short. It comes from the projection, so it sits
    // at the point the stop happened and stays there once the work resumes.
    if (it.kind === "stopped") return `<div class="stopped">⨯ stopped here</div>`;
    const { label, arg } = toolTitle(it);
    const body = it.output ?? "";
    const clip = body.split("\n").length > 9 && !expandedTools.has(it.id);
    return `<div class="turn"><div class="tool ${it.isError ? "err" : ""}">
      <div class="tool-head"><span class="sigil">${esc(label)}</span> <span class="arg">${esc(arg)}</span></div>
      ${body ? `<div class="tool-div">${it.isError ? "Error" : "Output"}</div>
      <div class="tool-body ${clip ? "clip" : ""}" data-body="${i}">${esc(body)}</div>
      ${body.split("\n").length > 9 ? `<div class="tool-more"><button data-expand="${esc(it.id)}">${clip ? "… expand" : "collapse"}</button></div>` : ""}` : ""}
    </div></div>`;
  }).join("");
}

let current = null, es = null;
/* The history entry created when a card opens carries its provenance with it.
   Memory-only state is not enough: Forward and a reload restore the entry but
   rebuild this script, and the back button still has to know the list is
   directly underneath. A hash that arrived with the page load (login redirect
   or bookmark) has no marker and must be stripped in place instead. */
const SESSION_HISTORY_STATE = "__ompSessionFromList";
/* Spinner frames from omp's unicode preset (SPINNER_FRAMES.status). A single
   shared timer drives every spinner on the page: one interval, no per-element
   state, and it stops dead when nothing is running so an idle phone does not
   repaint 12 times a second. */
const SPINNER = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
let spinTick = 0, spinTimer = null;
function tickSpinners() {
  const nodes = document.querySelectorAll(".spin");
  if (!nodes.length) { clearInterval(spinTimer); spinTimer = null; return; }
  const frame = SPINNER[spinTick++ % SPINNER.length];
  for (const n of nodes) n.textContent = frame;
}
function ensureSpinner() {
  if (!spinTimer && document.querySelector(".spin")) spinTimer = setInterval(tickSpinners, 80);
}

/* The TUI's working line: spinner + the current tool-call intent, with the live
   thinking trace under it. omp falls back to "Working…" before any intent
   arrives, so the phone shows motion from the first token rather than a blank. */
function renderWorking(activity) {
  const box = $("working");
  if (!activity?.working) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML =
    `<span class="spin">${SPINNER[0]}</span><div class="txt">` +
    `<span class="what">${esc(activity.intent || "Working…")}</span>` +
    (activity.thinking ? `<span class="trace">${esc(activity.thinking)}</span>` : "") +
    `</div>`;
  ensureSpinner();
}

/* Sessions as of the last refresh, so a start can tell an arriving session from
   one that was already running. */
let lastSessions = [];

/* Relative age for a card. The list sorts by recency, and with several sessions in
   one directory the cards were distinguishable only by pid — this is both the
   missing discriminator and the visible expression of the sort. */
function ageOf(startedAt) {
  const started = Date.parse(startedAt ?? "");
  if (!Number.isFinite(started)) return "";
  const mins = Math.max(0, Math.round((Date.now() - started) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m`;
  const hours = Math.round(mins / 60);
  return hours < 24 ? `${hours}h` : `${Math.round(hours / 24)}d`;
}

async function refresh() {
  if (current !== null) return;
  const res = await api("/api/sessions");
  if (!res.ok) return;
  const sessions = await res.json();
  lastSessions = sessions;
  /* A draft outlives its session otherwise, and the key is a pid: the OS recycles
     those, so a tab left open long enough would hand a dead session's draft to an
     unrelated new one with `send` armed — the wrong-agent send this map exists to
     prevent. Pruning against the authoritative list also bounds the map, which
     nothing else does. Safe here because `refresh` only runs on the list view, so no
     draft is being typed at the time.

     Two consecutive absences, not one. A failed request returns above this, but a
     *successful* one can still answer `[]` with every session alive: the portal
     serves before its first scan has attached anything, so restarting it — which
     `omp mobile update` does routinely — produces one empty tick that a
     single-miss rule would spend every draft on. A pid is not recycled into a new
     session inside the ~4s two misses take. */
  const live = new Set(sessions.map(s => s.pid));
  for (const pid of drafts.keys()) {
    if (live.has(pid)) draftMisses.delete(pid);
    else if (draftMisses.has(pid)) { drafts.delete(pid); draftMisses.delete(pid); }
    else draftMisses.set(pid, true);
  }
  // The reason to open the portal is a session that needs an answer, then one that is
  // working, then one whose turn ended but whose detached subagents have not — server
  // order is arbitrary and buries all three.
  const rank = s => (s.needsAttention ? 0 : s.streaming ? 1 : s.subagents ? 2 : 3);
  sessions.sort((a, b) => rank(a) - rank(b) || String(b.startedAt ?? "").localeCompare(String(a.startedAt ?? "")));
  $("list").innerHTML = sessions.length
    ? sessions.map(s => {
        const pct = s.context ? s.context.percent : 0;
        // A live fan-out gets the pulsing dot too: the dot is the most prominent mark on
        // the card, and leaving it neutral said nothing was happening on a session with
        // agents still running, contradicting both the word and the chip beside it.
        const state = s.needsAttention ? "ask" : s.streaming || s.subagents ? "run" : "";
        /* "waiting", not "idle", when the turn ended but a detached fan-out is still
           going: `idle` beside `⟳ 5 agents` on one row reads as a contradiction, and the
           session really is neither working nor finished.

           The chip's glyph is `status.running`, NOT the terminal badge's `icon.agents`
           (`👥`) — an emoji breaks the monospace grid every other glyph in this app
           keeps. Do not "restore fidelity" by pasting the emoji in.

           Both notes live here rather than beside the markup below because that is one
           template literal, and a backtick inside an HTML comment in it terminates the
           string. `bun run check` does not parse this file's inline script, so the only
           thing that catches it is loading the page. */
        const work = s.needsAttention ? "needs answer" : s.streaming ? "working" : s.subagents ? "waiting" : "idle";
        return `<button class="card" data-pid="${s.pid}">
          <div class="card-top">
            <span class="dot ${state}"></span>
            <span class="card-name">${esc(s.name)}</span>
            <span class="card-cwd">${esc(s.cwd)}</span>
          </div>
          <div class="meta">
            <span>${esc(s.model ?? "?")}</span>
            <span class="k">${work}</span>
            ${s.queued ? `<span class="k">${s.queued} queued</span>` : ""}
            <!-- The one chip on this card that is about the reader rather than the
                 agent. A draft is now scoped to its own session, which is right and
                 which also made it invisible: three sessions and ten minutes later
                 nothing said that one of them still holds a sentence you meant to
                 send. Beside the queued chip because both are something waiting to
                 reach that session, and carrying the composer's own sigil so the
                 mark and the control it points at share a glyph.
                 No backticks in this block: it is inside a template literal. -->
            ${drafts.has(s.pid) ? `<span class="k draft">› draft</span>` : ""}
            ${s.subagents ? `<span class="k ag-run">⟳ ${s.subagents} agent${s.subagents === 1 ? "" : "s"}</span>` : ""}
            <span class="k" style="display:flex;align-items:center;gap:5px">
              <span class="gauge"><i style="width:${Math.min(100, pct).toFixed(0)}%"></i></span>${pct.toFixed(1)}%
            </span>
            ${ageOf(s.startedAt) ? `<span class="k">${esc(ageOf(s.startedAt))} ago</span>` : ""}
            <span class="k">pid ${s.pid}</span>
          </div>
          ${
            s.activity?.working
              ? `<div class="card-act"><span class="spin">${SPINNER[0]}</span><span class="what">${esc(s.activity.intent || "Working…")}</span></div>`
              : ""
          }
        </button>`;
      }).join("")
    : `<div class="empty">no live sessions yet — tap “+ new” to start one</div>`;
  ensureSpinner();
  // A session started from the phone takes a few seconds to publish its room, and
  // it lands in an unsorted list of look-alike cards, so open it as soon as it
  // exists. Matching on cwd alone opened the *wrong* session whenever the chosen
  // directory already hosted one — the normal case for the repo you always work
  // in — dropping the user into another agent's context, so the arrival must also
  // be a pid that was not already there when the start was accepted.
  if (awaitingCwd) {
    const arrived = sessions.find(s => s.cwd === awaitingCwd && !awaitingKnownPids.has(s.pid));
    if (arrived) {
      clearAwaitingStart();
      open(arrived.pid);
      return;
    }
    // A start the server accepted whose session never publishes (a nanny that
    // cannot exec, a job that died) must not leave the form disabled forever.
    if (Date.now() - awaitingSince > START_WAIT_MS) {
      clearAwaitingStart();
      const st = $("newstatus");
      st.textContent = "started, but the session has not appeared yet — check the list";
      st.classList.add("err");
    }
  }
  for (const el of document.querySelectorAll(".card[data-pid]")) el.onclick = () => open(Number(el.dataset.pid));
}

/* Turn state for the open session, mirrored from the SSE frames so the header
   word, the turn control and the transcript marker all read the same truth. */
let streaming = false, interrupted = false, openCwd = "";

/* Header state word. Written from every path that changes the mirrors, not just
   the `state` frame: the activity frame is what sets `interrupted`, and it
   arrives after `state` on connect, so a header computed only there read "idle"
   on a session the marker and the turn control both showed as stopped. */
function renderHeader() {
  if (current === null) return;
  const label = innerWidth <= 640 ? (openCwd || "").split("/").pop() || String(current) : openCwd || String(current);
  const state = streaming ? "working" : interrupted ? "stopped" : "idle";
  $("sub").textContent = `${label} · ${state}`;
}

/* The seam now lives in the transcript itself (a `stopped` item derived from the
   aborted assistant message), so nothing here reaches into the DOM to place it.
   What stays live is the reassurance that the session survived a stop, and that
   belongs to the header word and the resume button rather than to history. */

/* One control, three states. Stop and resume are the two halves of "the turn",
   are mutually exclusive, and live in the same composer slot next to send —
   putting stop in the far top corner meant the most time-critical button in the
   app sat at the least reachable point, 6px from the button that navigates away.
   `send` keeps the single accent fill so the row never shows two primaries. */
function renderTurnControl(isStreaming, isInterrupted) {
  const turn = $("turn");
  turn.disabled = false;
  // `visibility`, not `hidden`: the slot stays in flow so the composer's geometry
  // never depends on turn state — the text field must not resize under a caret
  // when another participant starts a turn.
  if (isStreaming) {
    turn.style.visibility = "visible";
    turn.style.pointerEvents = "";
    turn.textContent = "stop";
    turn.className = "btn btn-stop";
    turn.title = "stop the current turn — the session stays open";
    turn.setAttribute("aria-label", "stop the current turn; the session stays open");
    return;
  }
  if (isInterrupted) {
    turn.style.visibility = "visible";
    turn.style.pointerEvents = "";
    turn.textContent = "resume";
    turn.className = "btn btn-go";
    turn.title = "continue the turn you stopped";
    turn.setAttribute("aria-label", "resume the turn you stopped");
    return;
  }
  turn.style.visibility = "hidden";
  turn.style.pointerEvents = "none";
}

/* Composer placeholders, as constants because three paths set them and because they
   have a hard width budget that two other rules own.

   A placeholder is only ever seen in the compact state, where the field shares its
   row with `stop` and `send`. That leaves it 153px of content on a 375px iPhone and
   168px on a 390px one, and the face advances 9.891px: 15 characters at 375px and
   16 at 390px, the narrower being the one that binds. The two rules that set the
   budget are `#turn, #send`'s `min-width` and `.prompt`'s `font-size` — both moved in
   this change, which is how copy measured at 390px ended up wrapping at 375px.
   Change either and re-measure the strings against the widest that fits.

   Longer copy does not ellipsise: a textarea wraps it to a second line that the
   one-row field then hides, so the resting composer read `steer the` and nobody could
   tell it was truncated. Both strings below are 15 characters, verified as one line at
   375px and 390px. A 320px screen wraps either way — the field is 98px there — and is
   left as it was. */
const PLACEHOLDER_STEER = "steer the agent";
const PLACEHOLDER_FIRST = "what to work on";

/* An empty transcript is the guaranteed first screen of a phone-started session,
   so it has to say something: which directory the session is in (the header
   truncates it to a basename on a narrow screen) and what to do next. The cwd
   comes from the cached value rather than an argument, because the transcript
   frame that follows `state` on connect has no cwd to pass and used to overwrite
   the guide with a version missing the one fact it exists to show. */
function renderEmptyLog() {
  $("log").innerHTML = `<div class="empty">no messages yet — tell it what to work on${
    openCwd ? `<div class="card-cwd" style="display:block;margin-top:6px">${esc(openCwd)}</div>` : ""
  }</div>`;
  $("msg").placeholder = PLACEHOLDER_FIRST;
}

/* An unsent draft belongs to the session it was typed in. The composer is one
   element shared by every session, so without this the text simply stayed in the
   field across a switch: a steer written for one agent sat in another's composer
   with `send` armed and nothing to say where it came from — and now that a failed
   send's red border is cleared on `open()` (correctly, it described the other
   session), there is no cue left at all. Stashing per pid keeps the file's promise
   never to swallow what someone typed while making the wrong-agent send impossible.
   In memory only: a draft is not worth persisting past the tab. */
const drafts = new Map();
/* Pids seen absent from one session list, so the prune in `refresh` can require two
   in a row before it spends someone's text. Keyed the same way, cleared the moment
   the pid comes back. */
const draftMisses = new Map();
function stashDraft() {
  if (current === null) return;
  const text = $("msg").value;
  if (text) drafts.set(current, text);
  else drafts.delete(current);
}

function open(pid) {
  // Close whatever is streaming first. `back` used to be the only way into this
  // function, so nothing here did; a deep link into an already-open tab (which the
  // hashchange listener now routes through here) left both streams live, and the
  // old session's frames kept overwriting the view the URL and header claimed.
  es?.close(); es = null;
  expandedTools = new Set();
  // A collapse choice belongs to the session it was made in; another session's
  // fan-out is a different size and deserves the size-based default again.
  agentsOpen = null;
  // Before `current` moves: the draft in the field still belongs to the old session.
  stashDraft();
