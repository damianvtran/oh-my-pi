    `<div class="todos"><button type="button" class="todos-h" id="todostoggle" aria-expanded="${expanded}">` +
    `<span class="caret" aria-hidden="true">${expanded ? "▾" : "▸"}</span>Todos${count}</button>${rows}</div>`
  );
}

/* ── status-line formatters ───────────────────────────────────────────────
   Shared by the composer's status row and the session list's cards, so a number
   the phone shows twice cannot be formatted two ways. */

/* `formatNumber` from @oh-my-pi/pi-utils: one decimal while the leading digit is
   small and non-zero, rounded above that. `984000` → `984K`, `1500` → `1.5K`. */
function formatNumber(n) {
  if (!Number.isFinite(n) || n < 0) return "0";
  const trim1 = v => {
    const s = v.toFixed(1);
    return s.endsWith(".0") ? s.slice(0, -2) : s;
  };
  if (n < 1e3) return String(Math.round(n));
  if (n < 1e4) return `${trim1(n / 1e3)}K`;
  if (n < 1e6) return `${Math.round(n / 1e3)}K`;
  if (n < 1e7) return `${trim1(n / 1e6)}M`;
  if (n < 1e9) return `${Math.round(n / 1e6)}M`;
  return `${trim1(n / 1e9)}B`;
}

/* `formatContextUsage`: `<pct>%/<window>`, degrading to `<tokens>/?` when the host
   could not name a context window — never `0.0%/0`. */
function contextText(usage) {
  if (!usage) return "";
  const window = usage.contextWindow;
  if (!Number.isFinite(window) || window <= 0) return `${formatNumber(usage.tokens ?? 0)}/?`;
  const pct = Number.isFinite(usage.percent) ? `${usage.percent.toFixed(1)}%` : "?";
  return `${pct}/${formatNumber(window)}`;
}

/* The four tiers from `context-thresholds.ts`. Each fires at whichever bound is
   reached first — the flat percentage or the token budget expressed as a
   percentage of this window — which is why a 22% reading on a 984K window is
   already `warn`: 150K of it is 15.2%. */
const CONTEXT_TIERS = [
  { cls: "crit", pct: 90, tokens: 500_000 },
  { cls: "high", pct: 70, tokens: 270_000 },
  { cls: "warn", pct: 50, tokens: 150_000 },
];
function contextClass(usage) {
  const pct = usage?.percent;
  if (!Number.isFinite(pct) || pct <= 0) return "";
  const window = usage.contextWindow;
  for (const tier of CONTEXT_TIERS) {
    const bound = Number.isFinite(window) && window > 0 ? Math.min(tier.pct, (tier.tokens / window) * 100) : tier.pct;
    if (pct >= bound) return tier.cls;
  }
  return "";
}

/* `formatDuration`: `123ms`, `1.5s`, `44m58s`, `2h30m`, `3d2h` — no space anywhere,
   and the smaller unit dropped when it is zero. */
function durationText(ms) {
  if (!Number.isFinite(ms) || ms <= 0) return "";
  if (ms < 1000) return `${Math.round(ms)}ms`;
  if (ms < 60_000) return `${(ms / 1000).toFixed(1)}s`;
  if (ms < 3_600_000) {
    const mins = Math.floor(ms / 60_000);
    const secs = Math.floor((ms % 60_000) / 1000);
    return secs > 0 ? `${mins}m${secs}s` : `${mins}m`;
  }
  if (ms < 86_400_000) {
    const hours = Math.floor(ms / 3_600_000);
    const mins = Math.floor((ms % 3_600_000) / 60_000);
    return mins > 0 ? `${hours}h${mins}m` : `${hours}h`;
  }
  const days = Math.floor(ms / 86_400_000);
  const hours = Math.floor((ms % 86_400_000) / 3_600_000);
  return hours > 0 ? `${days}d${hours}h` : `${days}d`;
}

/* Status glyph and colour per subagent. Glyphs come from omp's own unicode preset
   (theme.ts → UNICODE_SYMBOLS) so a row reads the same as the Agent Hub row for the
   same agent, with two deliberate departures, both because a 12px glyph has to differ
   in SHAPE and not only in hue: `parked` is `⏸` rather than the preset's `○` or
   `⦸`, which are the same ring as `⟳` for opposite meanings; and `aborted` is the `⨯`
   this app already marks a stopped turn with rather than `status.aborted`'s `⏹`, which
   renders from a fallback face as a solid block foreign to the surrounding line art.
   `idle` means the registry released the agent without a lifecycle verdict ever
   arriving — done, but not known to have succeeded. */
const AGENT_STATE = {
  running:   { glyph: "⟳", cls: "ag-run" },
  completed: { glyph: "✔", cls: "ag-ok" },
  failed:    { glyph: "✘", cls: "ag-err" },
  aborted:   { glyph: "⨯", cls: "ag-stop" },
  parked:    { glyph: "⏸", cls: "ag-off" },
  idle:      { glyph: "•", cls: "ag-off" },
};
/* An unrecognised status from a newer host must not masquerade as a state we know:
   falling back to the `idle` bullet made "we have no idea" indistinguishable from
   "finished, verdict unknown". `hasOwn` because a status of `constructor` would
   otherwise resolve through Object.prototype and skip the fallback entirely. */
const agentStateOf = status =>
  Object.hasOwn(AGENT_STATE, status) ? AGENT_STATE[status] : { glyph: "?", cls: "ag-off" };

/* Elapsed time for a subagent. Separate from `ageOf`: subagents live for seconds
   to minutes, and "just now" — the right answer for a session card — flattens the
   whole range that matters here. `durationMs` is preferred when the host sent it
   because it is computed host-side, so it carries no clock skew and freezes at the
   right value when the agent stops. Minutes are kept past the hour: a bare `1h`
   covered everything from 60 to 119 minutes, which is exactly the range where the
   number is the reason you would go look at a possibly-stuck agent. */
function elapsedOf(a) {
  // The one number on the row with no other guard: with neither field, `Date.now() -
  // undefined` is NaN, every comparison below is false, and the row printed `NaNh`.
  // An empty string drops out of the `.filter(Boolean)` join like every other field.
  const ms = Number.isFinite(a.durationMs) ? a.durationMs : Date.now() - a.startedAt;
  if (!Number.isFinite(ms)) return "";
  const secs = Math.max(0, Math.round(ms / 1000));
  if (secs < 60) return `${secs}s`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m`;
  const rem = mins % 60;
  return `${Math.floor(mins / 60)}h${rem ? `${rem}m` : ""}`;
}

/* `12.3k` / `1.2M`, the TUI's token shorthand. A phone row cannot spend 7 columns
   on a raw integer. */
function tokensOf(n) {
  if (!Number.isFinite(n) || n <= 0) return "";
  if (n < 1000) return String(n);
  return n < 1e6 ? `${(n / 1000).toFixed(1)}k` : `${(n / 1e6).toFixed(1)}M`;
}

/* Spend per agent. Rounded to the cent it is worth reading and no further: a
   fan-out is the most expensive thing this app can show you, and the raw float
   the host sends (`1.116988`) is nine characters of noise on a phone row. */
function costOf(n) {
  return Number.isFinite(n) && n >= 0.01 ? `$${n.toFixed(2)}` : "";
}

/* Whether the panel is expanded. `null` follows the size-based default below; a tap
   pins it either way for as long as the session stays open, the same lifetime
   `expandedTools` has. */
let agentsOpen = null;
/* Above this many rows the panel is collapsed until asked for. At the row cap with
   continuation lines it is ~470px tall directly above the composer, and it stays
   that way for as long as the fan-out runs — which is exactly when the transcript
   underneath it is worth reading. The header carries the counts, so a collapsed
   panel still answers "how many". */
const AGENTS_AUTO_COLLAPSE_OVER = 4;

/* The Subagents panel: the TUI HUD's `Id: description` rows, plus the live tool call
   underneath because the phone has no Agent Hub to open for it. Returns "" when the
   session has spawned nothing, so the panel is absent rather than an empty header —
   the same contract `renderTodos` has. */
function renderSubagents(s) {
  const rows = s?.rows ?? [];
  if (!rows.length) return "";
  // `total` counts every agent the projection kept and `rows` is capped, so the
  // header can say how many the cap is hiding rather than truncating silently.
  const total = s.total ?? rows.length;
  const hidden = Math.max(0, total - rows.length);
  // `N/M running`, the ratio grammar the todos header already uses, rather than prose
  // — it is shorter and always states both numbers. Every other count comes from the
  // projection, NOT from `rows`, which is capped: subtracting a capped failure count
  // from an uncapped total reported "11 done · 1 failed" for a twelve-agent fan-out
  // whose other four outcomes never reached the phone.
  //
  // A failure and the running total are stated TOGETHER, because the panel's default
  // state past four rows is collapsed and the header is then the whole panel: reporting
  // a failure only once everything had stopped withheld the one thing worth looking at
  // for exactly as long as it was actionable. Spend rides along for the same reason.
  const bad = s.failed ?? 0;
  const held = s.parked ?? 0;
  const spend = costOf(s.cost);
  const badPart = bad ? ` · <span class="bad">${bad} failed</span>` : "";
  const settled = [
    `${Math.max(0, total - bad - held)} done`,
    held ? `${held} parked` : "",
  ].filter(Boolean).join(" · ");
  const head = s.running
    ? `${s.running}/${total} running${badPart}`
    : bad || held
      ? `${settled}${badPart}`
      : `${total} done`;
  const open = agentsOpen ?? rows.length <= AGENTS_AUTO_COLLAPSE_OVER;
  // `aria-controls` only while the list exists: pointing it at a missing id is worst
  // exactly when collapsed, which is when a client would follow it. The caret is
  // decorative — `aria-expanded` already carries the state, and an unlabelled triangle
  // announces as its Unicode name.
  const header =
    `<button class="agents-h" id="agtoggle" aria-expanded="${open}"${open ? ' aria-controls="aglist"' : ""}>` +
    `Subagents<span class="count"> · ${head}${spend ? ` · ${spend}` : ""}</span>` +
    `<span class="caret" aria-hidden="true">${open ? "▾" : "▸"}</span></button>`;
  if (!open) return `<div class="agents">${header}</div>`;
  const body = rows.map((a, i) => {
    const last = i === rows.length - 1 && !hidden;
    const state = agentStateOf(a.status);
    // Continuation lines are indented under the id, with the trunk drawn only while
    // more rows follow. Four columns because that is where the id starts: two for the
    // branch and its space, two for the pinned glyph cell and its trailing column.
    const cont = `<span class="guide" aria-hidden="true">${last ? "    " : "│   "}</span>`;
    // `task` is the generic worker's display name, so it names nothing here and
    // collides with the assignment label below; the specific types (`scout`,
    // `reviewer`) are worth the slot. Cost sits second because it is the field most
    // worth reading and the last one an overflow would drop.
    const kind = a.agent && a.agent !== "task" ? a.agent : "";
    const meta = [kind, costOf(a.cost), elapsedOf(a)].filter(Boolean).join(" · ");
    const tokens = tokensOf(a.tokens);
    const volume = [tokens ? `${tokens} tok` : "", a.tools ? `${a.tools} tool${a.tools === 1 ? "" : "s"}` : ""]
      .filter(Boolean)
      .join(" · ");
    // `ag-done` dims the id, so parked stays out of it: the session is disposed but
    // revivable, which is not the same as finished.
    const spent = a.status !== "running" && a.status !== "parked" ? " ag-done" : "";
    const id =
      `<div class="tree-row${spent}"><span class="guide" aria-hidden="true">${last ? "└ " : "├ "}</span>` +
      `<span class="ag-st ${state.cls}" aria-hidden="true">${state.glyph}</span>` +
      `<span class="sr">${esc(a.status)} </span>` +
      `<span class="tree-body"><span class="ag-id">${esc(a.id)}</span>` +
      (meta ? ` <span class="ag-meta">${esc(meta)}</span>` : "") +
      `</span></div>`;
    const task = a.task ? `<div class="tree-row">${cont}<span class="tree-body ag-task">${esc(a.task)}</span></div>` : "";
    // A running agent has a "right now"; a finished one's last tool is history and
    // would read as though it were still working, so its row shows what the run cost
    // instead. One slot either way, and not an unconditional one: a running agent that
    // has not reported a tool yet, or a finished one whose lifecycle arrived with no
    // progress detail, has neither — and with no label either, that row is one line.
    const tail = a.status === "running" ? (a.intent ? `• ${a.intent}` : "") : volume;
    const what = tail ? `<div class="tree-row">${cont}<span class="tree-body ag-what">${esc(tail)}</span></div>` : "";
    // One list item per AGENT, not per line: the 1-3 rows below belong together, and a
    // flat run of divs gave assistive tech no count and no way to step agent by agent.
    return `<div role="listitem">${id}${task}${what}</div>`;
  }).join("");
  // Structurally an agent row, ellipsis in the glyph cell, so the truncation notice
  // lands on the same column as every id instead of two columns to its left.
  const more = hidden
    ? `<div role="listitem" class="tree-row"><span class="guide" aria-hidden="true">└ </span>` +
      `<span class="ag-st ag-off" aria-hidden="true">…</span>` +
      `<span class="tree-body ag-more">${hidden} more</span></div>`
    : "";
  return `<div class="agents">${header}<div id="aglist" role="list">${body}${more}</div></div>`;
}

/* Tool cards the user opened. The transcript is re-rendered wholesale on every
   frame, so an expansion that lived only as a removed class disappeared on the
   next token — unusable exactly while a turn is running, which is when someone
   wants to read what the agent is doing. Keyed by tool call id, not by index, so
   the set survives cards falling off the front of the cap. */
let expandedTools = new Set();

/* Output rows a collapsed card keeps. `PREVIEW_LIMITS.OUTPUT_SETTLED` is 1 in the
   fullscreen viewport and the settled card drops even that, showing its identity
   row alone — "a finished call is history: its header already carries the outcome,
   and one click brings the rest back". This surface follows that: nothing but the
   identity row until it is tapped. */
const COLLAPSED_OUTPUT_ROWS = 0;
/* Rows an EXPANDED card shows per page. The terminal caps its expanded view too
   (`PREVIEW_LIMITS.OUTPUT_EXPANDED` is 10) because it is spending rows of a fixed
   screen; a phone is scrolling, and a tap on a card is an explicit request to read
   that call, so the page here is generous rather than tight. It exists at all
   because a tool result is unbounded — a build log or a full-file read can be tens
   of thousands of lines, and pushing that through `innerHTML` on a phone is a
   several-second freeze.

   The remainder is named with the terminal's own `… N more lines` marker, and here
   that marker is a CONTROL: each tap adds another page. The terminal can leave it
   inert because a laptop is one keystroke from the raw result; a phone is not, so an
   inert marker made everything past row 200 unreachable from the only device the
   reader has. */
const EXPANDED_OUTPUT_ROWS = 200;
/* Extra pages a card has been asked for, by tool call id. Same lifetime and same
   reason as `expandedTools`: the transcript repaints wholesale, so a count that
   lived in the DOM would reset on the next token. */
let toolPages = new Map();

function renderTranscript(items) {
  return items
    .map(it => {
      if (it.kind === "user") {
        // `from` is only set for a prompt another participant sent, so an unnamed
        // card is unambiguously this phone's own.
        const who = it.from ? `<span class="user-from">${esc(it.from)} </span>` : "";
        return `<div class="turn"><div class="user-line">${who}${esc(it.text)}</div></div>`;
      }
      if (it.kind === "assistant") return `<div class="turn"><div class="md">${md(it.text)}</div></div>`;
      /* Reasoning is not rendered at all — the same thing `hideThinkingBlock` does
         in the TUI, chosen unconditionally here because a phone screen is the one
         place where a paragraph of reasoning per turn buries the work. The items
         are still projected and still cross the wire: this is a rendering
         decision, and dropping them upstream would also drop them for the
         snapshot fetches and the tests that pin the projection. */
      if (it.kind === "thinking") return "";
      // The seam where a turn was cut short. It comes from the projection, so it sits
      // at the point the stop happened and stays there once the work resumes.
      // `status.aborted`'s own glyph, in the warning role.
      if (it.kind === "stopped") return `<div class="stopped">⏹ stopped here</div>`;
      const body = it.output ?? "";
      const rows = body ? body.split("\n") : [];
      const open = expandedTools.has(it.id);
      // A card with nothing behind it is inert: no press feedback, no hint, and
      // `.tool:not(.more)` drops the pointer cursor, matching a TUI block that
      // "publishes a zone only to be copyable".
      const more = rows.length > COLLAPSED_OUTPUT_ROWS;
      /* `formatExpandHint` — never dropped while collapsed, because nothing else on
         the card says that it opens. `⟦tap⟧` rather than the viewport's
         `⟦click to expand⟧`: that phrasing cost 16.4 of a 390px row's 44.6 columns
         and named a gesture a phone does not have. `⟦collapse⟧` when open is this
         surface's other addition — the terminal can drop the hint because its hover
         fill still marks the card as live, and a touch screen has no hover. */
      const hint = more ? `<span class="tool-hint">${open ? "⟦collapse⟧" : "⟦tap⟧"}</span>` : "";
      const cap = EXPANDED_OUTPUT_ROWS * (1 + (toolPages.get(it.id) ?? 0));
      const shown = open ? rows.slice(0, cap) : rows.slice(0, COLLAPSED_OUTPUT_ROWS);
      const hidden = rows.length - shown.length;
      // Spans, not divs, and blocked out in CSS: `<button>` takes phrasing content
      // only, and a div inside one costs text selection in Chrome — which on a card
      // whose whole point is a path and a command is the thing a reader wants most.
      const output = shown.length ? `<span class="tool-body">${esc(shown.join("\n"))}</span>` : "";
      /* `… N more lines`, the row the terminal leaves where it clipped a tail, as a
         control: `data-page` asks the delegated handler for another page. Only an
         EXPANDED card can show it — a collapsed one draws no body at all, and a count
         of lines beside `⟦tap⟧` would state the same fact twice.

         A <span role="button"> rather than a nested <button>, which is invalid inside
         the card's own button and gets flattened by the parser. */
      const rest = open && hidden > 0
        ? `<span class="tool-more-lines" role="button" tabindex="0" data-page="${esc(it.id)}">` +
          `… ${hidden} more line${hidden === 1 ? "" : "s"} · tap for ${Math.min(hidden, EXPANDED_OUTPUT_ROWS)}</span>`
        : "";
      // An inert card keeps its button element (so focus order and copy behave the
      // same on every card) but carries no `data-toggle`, so the delegated handler
      // ignores it — the TUI's `onZoneClick` returns false for exactly this case.
      const { id, stats } = toolIdentity(it);
      return (
        `<div class="turn"><button type="button" class="tool${it.isError ? " err" : ""}${more ? " more" : ""}"` +
        `${more ? ` data-toggle="${esc(it.id)}" aria-expanded="${open}"` : ""}>` +
        `<span class="tool-head"><span class="tool-id">${id}</span>` +
        `${stats ? `<span class="tool-stats">${stats}</span>` : ""}${hint}</span>` +
        `${output}${rest}</button></div>`
      );
    })
    .join("");
}

/* The transcript as last received, so a tap that changes nothing but the expanded
   set can repaint from it. Keeping the array is what lets the toggle be one
   DELEGATED listener installed once (see below) instead of a handler per card
   rebound on every frame: a fan-out repaints several times a second, and rebinding
   there dropped the identity of whichever card the last render happened to close
   over. */
let lastTranscript = [];

/* Paint `lastTranscript`. `keepBottom` is the answer to "was the reader at the
   latest line before this changed" — a phone reads this from the bottom, and a
   repaint must not move someone who had scrolled up to read something. */
function paintTranscript(keepBottom) {
  const html = renderTranscript(lastTranscript);
  // Emptiness is decided on the RENDERED transcript, not on the item count: a tail
  // made only of thinking items renders to nothing, and testing the array left the
  // log blank with no explanation of why.
  if (!html) renderEmptyLog();
  else {
    $("log").innerHTML = html;
    $("msg").placeholder = PLACEHOLDER_STEER;
  }
  if (keepBottom) main.scrollTop = main.scrollHeight;
}

/* Todos as last received, for the same reason `lastTranscript` exists: the panel's
   own disclosure toggle has to repaint from it, and on a settled session the next
   push may never come. */
let lastTodos = null;

function paintTodos() {
  const atBottom = isAtBottom(60);
  $("todos").innerHTML = renderTodos(lastTodos);
  const toggle = $("todostoggle");
  // Rebound on every paint because the panel's HTML is replaced wholesale. Unlike
  // the subagents header this is safe: todos push on a tool result, not several times
  // a second under a fan-out, so there is no focus to lose mid-interaction.
  if (toggle) {
    toggle.onclick = () => {
      todosOpen = !(todosOpen === true);
      paintTodos();
    };
  }
  if (atBottom) main.scrollTop = main.scrollHeight;
}
let current = null, es = null;
/* The history entry created when a card opens carries its provenance with it.
   Memory-only state is not enough: Forward and a reload restore the entry but
   rebuild this script, and the back button still has to know the list is
   directly underneath. A hash that arrived with the page load (login redirect
   or bookmark) has no marker and must be stripped in place instead. */
const SESSION_HISTORY_STATE = "__ompSessionFromList";
/* Spinner frames from omp's unicode preset (SPINNER_FRAMES.status). A single
   shared timer drives every spinner on the page: one interval, no per-element
   state, and it stops dead when nothing is running so an idle phone does not
   repaint 12 times a second. */
const SPINNER = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
let spinTick = 0, spinTimer = null;
function tickSpinners() {
  const nodes = document.querySelectorAll(".spin");
  if (!nodes.length) { clearInterval(spinTimer); spinTimer = null; return; }
  const frame = SPINNER[spinTick++ % SPINNER.length];
  for (const n of nodes) n.textContent = frame;
}
/* The one animation this page drives from JS, so it checks the query the CSS branch
   above checks: a reader who asked the OS to hold still gets the first braille frame
   as a static glyph, and the working line still says what is running in words. */
const reducedMotion = () => matchMedia?.("(prefers-reduced-motion: reduce)")?.matches === true;
function ensureSpinner() {
  if (reducedMotion()) return;
  if (!spinTimer && document.querySelector(".spin")) spinTimer = setInterval(tickSpinners, 80);
}

/* The TUI's working line: `<spinner> <intent> ⟦esc⟧`, one canvas row above the
   composer. omp falls back to `Working…` before any intent arrives, so the phone
   shows motion from the first token rather than a blank, and the trailing bracketed
   `esc` is `interruptHint()` — a real affordance here, since the composer's `stop`
   is what it names.

   The streamed thinking trace this used to show underneath is deliberately gone:
   this surface hides reasoning everywhere, and a live trace under the intent was
   the loudest instance of it. `activity.thinking` still arrives and is still part
   of the projection; nothing renders it. */
function renderWorking(activity) {
  const box = $("working");
  if (!activity?.working) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML =
    `<span class="spin">${SPINNER[0]}</span>` +
    `<span class="what">${esc(activity.intent || "Working…")}<span class="esc"> ⟦esc⟧</span></span>`;
  ensureSpinner();
}

/* ── the composer's status line ───────────────────────────────────────────
   The TUI's own segments, in the TUI's own order, with `▶`/`◀` between them and
   `sep.dot` (" · ") inside the model segment. Left: `π ▶ ⬢ <model> · <thinking> ▶
   ▤ <cwd> ▶ ◫ <pct>%/<window>`. Right: `◀ ◈ N agents ⏱ <age>`.

   Segment PLACEMENT follows `presets.default`, which puts `context_pct` in the LEFT
   group after `path` — not in the right group. That matters on this screen rather
   than in a terminal: the left group survives, so a phone measured at 390px kept the
   two facts that never change (the model name and the cwd) and dropped all four that
   do. Context is the number a reader opens the phone to check.

   Four knowing departures from `segments.ts`, each because the wire or the screen is
   narrower than the terminal's own:

   - `time_spent` measures the union of the host's `agent_start`→`agent_end`
     windows. That number is not published, so this shows the session's age from
     its collab record — the same glyph over a different quantity, which is the one
     thing in this row that is not the terminal's own number. It is printed with
     `ageOf`'s coarseness, not `formatDuration`'s: a seconds-precision `37m53s`
     churned on every tick and disagreed with the same session's `37m` on its list
     card, for a quantity nobody reads to the second.
   - `session_name` is omitted. It is the tail of the right group, which is the
     first thing the terminal pops when the bar does not fit, and this bar never
     fits a session title on a 390px screen. The header states it instead, in full.
   - The folder and agent glyphs are geometric (`▤`/`▥`, `◈`), not `icon.folder`'s
     `📁`/`🗑` or `👥`. Line 1963 states the rule this follows: an emoji breaks the
     monospace grid every other glyph in this app keeps — one cell in a terminal,
     1.6 cells of Apple Color Emoji with its own baseline in a browser — and it is
     worst in the row that is always on screen. `🗑` beside a path also reads as a
     delete affordance in a UI that has buttons.
   - `git`, `pr`, `mode` and `cost` have no wire fields at all and are simply
     absent, exactly as the TUI omits a segment whose `visible` is false.

   Overflow is resolved by DROPPING segments, not by squeezing them: with every
   segment shrinkable, a narrow screen produced a row of four ellipses that named
   nothing (`Qwen3.8 Max Pr… ~/t… Align hyperplane-cpp w…`). The terminal pops right
   segments from the tail, then shrinks `path`, then drops left segments while
   preserving `path` — so this measures the painted row and removes the least
   valuable remaining segment until it fits, leaving `path` elastic as the one
   segment allowed to end in `…`. */
const THINKING_LABEL = {
  minimal: "○ min", low: "◔ low", medium: "◑ med",
  high: "◒ high", xhigh: "◕ xhigh", max: "◉ max",
};
/* `SCRATCH_ROOTS`: a cwd under a temp root gets `icon.scratchFolder` rather than
   `icon.folder`. Matched on the shortened path, which is the form this page holds. */
const isScratchPath = value => /^(?:~\/tmp|\/tmp|\/var\/tmp|\/private\/tmp|\/private\/var\/tmp)(?:\/|$)/.test(value);

/* Drop order, cheapest first, and it is the terminal's: left segments are dropped
   from the tail with `path` preserved longest, so the cwd is the LAST thing to go
   here too — it never appears in this list. `π` is not droppable either; it is one
   column and it is what marks this row as omp's status line rather than a caption.
   The thinking tail leads because it is seven columns of nicety inside a segment
   whose name is the part that matters. */
const STATUS_DROP_ORDER = ["time", "agents", "thinking", "context", "model"];

/* The row's composition, split from the measuring loop below so it can be tested
   without a layout: `dropped` in, the two segment arrays out. Reads the same
   `open*` state the loop does — the split is about testability, not purity. */
function statusSegments(dropped) {
  const level = THINKING_LABEL[openThinking];
  const cwd = openCwd ? shortenPath(openCwd) : "";
  const ctx = contextText(openContext);
  // `ageOf`'s coarseness, not `durationText`'s: see this section's own note.
  const age = openStartedAt ? ageOf(openStartedAt) : "";
  const left = [`<span class="pi">π</span>`];
  if (openModel && !dropped.has("model")) {
    left.push(
      `<span class="model">⬢ ${esc(openModel)}` +
        (level && !dropped.has("thinking") ? `<span class="sdot"> · ${esc(level)}</span>` : "") +
        `</span>`,
    );
  }
  if (cwd && !dropped.has("path")) {
    // `▥` for a scratch root, `▤` otherwise — `icon.scratchFolder`'s distinction in
    // the geometric vocabulary the rest of the row uses.
    left.push(`<span class="path">${isScratchPath(cwd) ? "▥" : "▤"} ${esc(cwd)}</span>`);
  }
  // Context in the LEFT group, where `presets.default` puts `context_pct`.
  if (ctx && !dropped.has("context")) {
    left.push(`<span class="ctx-icon">◫ <span class="ctx ${contextClass(openContext)}">${esc(ctx)}</span></span>`);
  }
  const right = [];
  if (openAgents > 0 && !dropped.has("agents")) {
    right.push(`<span class="agents">◈ ${openAgents} agent${openAgents === 1 ? "" : "s"}</span>`);
  }
  if (age && !dropped.has("time")) right.push(`<span class="time">⏱ ${esc(age)}</span>`);
  return { left, right };
}

function renderStatusLine() {
  const bar = $("statusline");
  if (current === null) { bar.innerHTML = ""; return; }
  // `dropped` is a set of segment keys this pass has given up on. Rebuilt from
  // scratch on every render so a rotated phone or a closed keyboard gets its
  // segments back rather than staying permanently trimmed to the narrowest width
  // the row was ever measured at.
  const dropped = new Set();
  const paint = () => {
    const { left, right } = statusSegments(dropped);
    bar.innerHTML =
      `<span class="left">${left.join(`<span class="sep" aria-hidden="true">▶</span>`)}</span>` +
      (right.length
        ? `<span class="right"><span class="sep" aria-hidden="true">◀</span>${right.join(" ")}</span>`
        : "");
  };
  paint();
  // `scrollWidth` exceeds `clientWidth` only because every segment but `path` is
  // `flex: none` — with all of them shrinkable the row always "fits" and this loop
  // would never run. One column of slack absorbs sub-pixel layout widths.
  // A zero width is "not laid out yet", not "nothing fits": the composer is hidden
  // while the list is on screen, and dropping against that measurement stripped the
  // row to a bare `π` on the frame that opened a session. The next render re-derives
  // `dropped` from scratch, so skipping here costs nothing.
  if (bar.clientWidth === 0) return;
  for (const key of STATUS_DROP_ORDER) {
    if (bar.scrollWidth <= bar.clientWidth + 1) break;
    dropped.add(key);
    paint();
  }
}

/* Sessions as of the last refresh, so a start can tell an arriving session from
   one that was already running. */
let lastSessions = [];

/* Relative age for a card. The list sorts by recency, and with several sessions in
   one directory the cards were distinguishable only by pid — this is both the
   missing discriminator and the visible expression of the sort. */
function ageOf(startedAt) {
  const started = Date.parse(startedAt ?? "");
  if (!Number.isFinite(started)) return "";
  const mins = Math.max(0, Math.round((Date.now() - started) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m`;
  const hours = Math.round(mins / 60);
  return hours < 24 ? `${hours}h` : `${Math.round(hours / 24)}d`;
}

async function refresh() {
  if (current !== null) return;
  const res = await api("/api/sessions");
  if (!res.ok) return;
  const sessions = await res.json();
  lastSessions = sessions;
  /* A draft outlives its session otherwise, and the key is a pid: the OS recycles
     those, so a tab left open long enough would hand a dead session's draft to an
     unrelated new one with `send` armed — the wrong-agent send this map exists to
     prevent. Pruning against the authoritative list also bounds the map, which
     nothing else does. Safe here because `refresh` only runs on the list view, so no
     draft is being typed at the time.

     Two consecutive absences, not one. A failed request returns above this, but a
     *successful* one can still answer `[]` with every session alive: the portal
     serves before its first scan has attached anything, so restarting it — which
     `omp mobile update` does routinely — produces one empty tick that a
     single-miss rule would spend every draft on. A pid is not recycled into a new
     session inside the ~4s two misses take. */
  const live = new Set(sessions.map(s => s.pid));
  for (const pid of drafts.keys()) {
    if (live.has(pid)) draftMisses.delete(pid);
    else if (draftMisses.has(pid)) { drafts.delete(pid); draftMisses.delete(pid); }
    else draftMisses.set(pid, true);
  }
  // The reason to open the portal is a session that needs an answer, then one that is
  // working, then one whose turn ended but whose detached subagents have not — server
  // order is arbitrary and buries all three.
  const rank = s => (s.needsAttention ? 0 : s.streaming ? 1 : s.subagents ? 2 : 3);
  sessions.sort((a, b) => rank(a) - rank(b) || String(b.startedAt ?? "").localeCompare(String(a.startedAt ?? "")));
  $("list").innerHTML = sessions.length
    ? sessions.map(s => {
        // A live fan-out gets the pulsing dot too: the dot is the most prominent mark on
        // the card, and leaving it neutral said nothing was happening on a session with
        // agents still running, contradicting both the word and the chip beside it.
        const state = s.needsAttention ? "ask" : s.streaming || s.subagents ? "run" : "";
        /* "waiting", not "idle", when the turn ended but a detached fan-out is still
           going: `idle` beside `⟳ 5 agents` on one row reads as a contradiction, and the
           session really is neither working nor finished.

           The chip's glyph is `status.running`, NOT the terminal badge's `icon.agents`
           (`👥`) — an emoji breaks the monospace grid every other glyph in this app
           keeps. Do not "restore fidelity" by pasting the emoji in.

           Both notes live here rather than beside the markup below because that is one
           template literal, and a backtick inside an HTML comment in it terminates the
           string. `bun run check` does not parse this file's inline script, so the only
           thing that catches it is loading the page. */
        const work = s.needsAttention ? "needs answer" : s.streaming ? "working" : s.subagents ? "waiting" : "idle";
        const ctx = contextText(s.context);
        return `<button class="card" data-pid="${s.pid}">
          <div class="card-top">
            <span class="dot ${state}" aria-hidden="true">●</span>
            <span class="card-name">${esc(s.name)}</span>
            <span class="card-cwd">${esc(s.cwd)}</span>
          </div>
          <div class="meta">
            <span>${esc(s.model ?? "?")}</span>
            <span class="k">${work}</span>
            ${s.queued ? `<span class="k">${s.queued} queued</span>` : ""}
            <!-- The one chip on this card that is about the reader rather than the
                 agent. A draft is now scoped to its own session, which is right and
                 which also made it invisible: three sessions and ten minutes later
                 nothing said that one of them still holds a sentence you meant to
                 send. Beside the queued chip because both are something waiting to
                 reach that session.
                 No backticks in this block: it is inside a template literal. -->
            ${drafts.has(s.pid) ? `<span class="k draft">draft</span>` : ""}
            ${s.subagents ? `<span class="k ag-run">⟳ ${s.subagents} agent${s.subagents === 1 ? "" : "s"}</span>` : ""}
            <!-- The status line's own context segment, with the glyph outside the
                 coloured span exactly as contextPctSegment builds it. No backticks
                 in this block either: it is inside a template literal. -->
            ${ctx ? `<span class="k">◫ <span class="ctx ${contextClass(s.context)}">${esc(ctx)}</span></span>` : ""}
            ${ageOf(s.startedAt) ? `<span class="k">⏱ ${esc(ageOf(s.startedAt))}</span>` : ""}
            <span class="k">pid ${s.pid}</span>
          </div>
          ${
            s.activity?.working
              ? `<div class="card-act"><span class="spin">${SPINNER[0]}</span><span class="what">${esc(s.activity.intent || "Working…")}</span></div>`
              : ""
          }
        </button>`;
      }).join("")
    : `<div class="empty">no live sessions yet — tap “+ new” to start one</div>`;
  ensureSpinner();
  // A session started from the phone takes a few seconds to publish its room, and
  // it lands in an unsorted list of look-alike cards, so open it as soon as it
  // exists. Matching on cwd alone opened the *wrong* session whenever the chosen
  // directory already hosted one — the normal case for the repo you always work
  // in — dropping the user into another agent's context, so the arrival must also
  // be a pid that was not already there when the start was accepted.
  if (awaitingCwd) {
    const arrived = sessions.find(s => s.cwd === awaitingCwd && !awaitingKnownPids.has(s.pid));
    if (arrived) {
      clearAwaitingStart();
      open(arrived.pid);
      return;
    }
    // A start the server accepted whose session never publishes (a nanny that
    // cannot exec, a job that died) must not leave the form disabled forever.
    if (Date.now() - awaitingSince > START_WAIT_MS) {
      clearAwaitingStart();
      const st = $("newstatus");
      st.textContent = "started, but the session has not appeared yet — check the list";
      st.classList.add("err");
    }
  }
  for (const el of document.querySelectorAll(".card[data-pid]")) el.onclick = () => open(Number(el.dataset.pid));
}

/* Turn state for the open session, mirrored from the SSE frames so the header
   word, the turn control and the transcript marker all read the same truth. */
let streaming = false, interrupted = false, openCwd = "";
/* A pending approval. Its own flag rather than a derivation, because the host is
   still `working` while it waits on one — the tool call has not returned — so the
   header could not tell the two states apart from the activity frame alone. */
let pendingAsk = false;
/* The rest of what the composer's status line states, from the same frames. Held
   as flat variables rather than one object because each arrives on a different
   frame — `state` carries the model, the thinking level, the cwd and the context;
   `subagents` carries the running count — and a partial object would have to be
   merged on every one of them.

   `openStartedAt` and `openName` come from the session list instead: neither is on
   the collab state frame, and `open()` reads them out of the last refresh so a card
   tapped from the list carries them straight into the detail view. */
let openModel = "", openThinking = "", openContext = null, openAgents = 0;
let openStartedAt = "", openName = "";

/* Header state word. Written from every path that changes the mirrors, not just
   the `state` frame: the activity frame is what sets `interrupted`, and it
   arrives after `state` on connect, so a header computed only there read "idle"
   on a session the marker and the turn control both showed as stopped.

   The label is the session's own name when it has one, and its directory
   otherwise — the status line at the other end of the screen already carries the
   `~`-shortened path in its own segment, so repeating it here spent the only wide
   line in the header on a fact stated twice. */
function renderHeader() {
  if (current === null) return;
  const dir = shortenPath(openCwd || "");
  const fallback = innerWidth <= 640 ? dir.split("/").pop() || String(current) : dir || String(current);
  /* `needs answer` outranks `working`, and that ordering is the point: while an
     approval is pending the host's `working` flag is still true — it is inside the
     tool call — so the header said "working" on a session that was blocked on the
     reader. The list card already computes this word for the same state
     (`needsAttention`), and the two views should not disagree about which session
     wants something. */
  const state = pendingAsk ? "needs answer" : streaming ? "working" : interrupted ? "stopped" : "idle";
  $("sub").textContent = `${openName || fallback} · ${state}`;
  $("sub").classList.toggle("ask", pendingAsk);
}

/* The seam now lives in the transcript itself (a `stopped` item derived from the
   aborted assistant message), so nothing here reaches into the DOM to place it.
   What stays live is the reassurance that the session survived a stop, and that
   belongs to the header word and the resume button rather than to history. */

/* One control, three states. Stop and resume are the two halves of "the turn",
   are mutually exclusive, and live in the same composer slot next to send —
   putting stop in the far top corner meant the most time-critical button in the
   app sat at the least reachable point, 6px from the button that navigates away.
   `send` keeps the single accent fill so the row never shows two primaries. */
function renderTurnControl(isStreaming, isInterrupted) {
  const turn = $("turn");
  turn.disabled = false;
  // `visibility`, not `hidden`: the slot stays in flow so the composer's geometry
  // never depends on turn state — the text field must not resize under a caret
  // when another participant starts a turn.
  if (isStreaming) {
    turn.style.visibility = "visible";
    turn.style.pointerEvents = "";
    turn.textContent = "stop";
    turn.className = "btn btn-stop";
    turn.title = "stop the current turn — the session stays open";
    turn.setAttribute("aria-label", "stop the current turn; the session stays open");
    return;
  }
  if (isInterrupted) {
    turn.style.visibility = "visible";
    turn.style.pointerEvents = "";
    turn.textContent = "resume";
    turn.className = "btn btn-go";
    turn.title = "continue the turn you stopped";
    turn.setAttribute("aria-label", "resume the turn you stopped");
    return;
  }
  turn.style.visibility = "hidden";
  turn.style.pointerEvents = "none";
}

/* Composer placeholders, as constants because three paths set them and because they
   have a hard width budget that two other rules own.

   A placeholder is only ever seen in the compact state, where the field shares its
   row with `stop` and `send`. That leaves it 153px of content on a 375px iPhone and
   168px on a 390px one, and the face advances 9.891px: 15 characters at 375px and
   16 at 390px, the narrower being the one that binds. The two rules that set the
   budget are `#turn, #send`'s `min-width` and `.field`'s horizontal padding (the
   `.prompt` element that used to own the second half is gone — the field is a
   textarea now and carries the chrome itself). Change either and re-measure the
   strings against the widest that fits.

   Longer copy does not ellipsise: a textarea wraps it to a second line that the
   one-row field then hides, so the resting composer read `steer the` and nobody could
   tell it was truncated. Both strings below are 15 characters, verified as one line at
   375px and 390px. A 320px screen wraps either way — the field is 98px there — and is
   left as it was. */
const PLACEHOLDER_STEER = "steer the agent";
const PLACEHOLDER_FIRST = "what to work on";

/* An empty transcript is the guaranteed first screen of a phone-started session,
   so it has to say something: which directory the session is in (the header
   truncates it to a basename on a narrow screen) and what to do next. The cwd
   comes from the cached value rather than an argument, because the transcript
   frame that follows `state` on connect has no cwd to pass and used to overwrite
   the guide with a version missing the one fact it exists to show. */
function renderEmptyLog() {
  $("log").innerHTML = `<div class="empty">no messages yet — tell it what to work on${
    openCwd ? `<div class="card-cwd" style="display:block;margin-top:6px">${esc(openCwd)}</div>` : ""
  }</div>`;
  $("msg").placeholder = PLACEHOLDER_FIRST;
}

/* An unsent draft belongs to the session it was typed in. The composer is one
   element shared by every session, so without this the text simply stayed in the
   field across a switch: a steer written for one agent sat in another's composer
   with `send` armed and nothing to say where it came from — and now that a failed
   send's red border is cleared on `open()` (correctly, it described the other
   session), there is no cue left at all. Stashing per pid keeps the file's promise
   never to swallow what someone typed while making the wrong-agent send impossible.
   In memory only: a draft is not worth persisting past the tab. */
const drafts = new Map();
/* Pids seen absent from one session list, so the prune in `refresh` can require two
   in a row before it spends someone's text. Keyed the same way, cleared the moment
   the pid comes back. */
const draftMisses = new Map();
function stashDraft() {
  if (current === null) return;
  const text = $("msg").value;
  if (text) drafts.set(current, text);
  else {
    // The miss count goes with the draft it was counting for. The prune only walks
    // `drafts`, so a miss left behind here is unreachable — and worse than unreachable:
    // the next draft typed under this pid inherits it and is deleted on its first
    // absence, which is the single-tick loss the two-strike rule exists to prevent.
    drafts.delete(current);
    draftMisses.delete(current);
  }
}

function open(pid) {
  // Close whatever is streaming first. `back` used to be the only way into this
  // function, so nothing here did; a deep link into an already-open tab (which the
  // hashchange listener now routes through here) left both streams live, and the
  // old session's frames kept overwriting the view the URL and header claimed.
  es?.close(); es = null;
  // The array belongs to the session it was received for, exactly as in
  // `closeSession()` — which documents why: the next session's first repaint would

  try { localStorage.setItem(DIRECTORY_MEMORY_KEY, JSON.stringify({ last: cwd, recent })); } catch {}
}
/* Name first, then the path: a native select clips the tail, which is exactly the
   segment that tells `…/oh-my-pi` from `…/oh-my-pi-mobile-session-control` apart.
   `~` buys back the width the home prefix costs. */
function directoryLabel(dir, home) {
  const short = home && dir.startsWith(home) ? `~${dir.slice(home.length)}` : dir;
  const name = dir.replace(/\/+$/, "").split("/").pop();
  // `/tmp` would otherwise read "tmp — /tmp": name-first buys nothing when the
  // path is barely longer than the name.
  if (!name || short === name || short === `/${name}`) return short;
  return `${name} — ${short}`;
}
function addDirectoryGroup(select, label, directories, seen, home) {
  const choices = directories.filter(dir => typeof dir === "string" && dir && !seen.has(dir));
  if (!choices.length) return;
  const group = document.createElement("optgroup");
  group.label = label;
  for (const dir of choices) {
    seen.add(dir);
    const option = document.createElement("option");
    option.value = dir;
    option.textContent = directoryLabel(dir, home);
    group.append(option);
  }
  select.append(group);
}
/* One control for one value. The select is the thing you operate; the text field
   only appears for a path that is not in the list, so the common case is a single
   row showing a single directory instead of two rows showing the same string. */
function renderDirectorySuggestions(suggestions) {
  const select = $("newsuggest");
  const memory = loadDirectoryMemory();
  const home = typeof suggestions?.home === "string" ? suggestions.home : "";
  const recent = Array.isArray(suggestions?.recent) ? suggestions.recent : [];
  const seen = new Set();
  select.replaceChildren();

  if (home) {
    seen.add(home);
    const option = document.createElement("option");
    option.value = home;
    option.textContent = `home — ${home}`;
    select.append(option);
  }
  addDirectoryGroup(select, "on this phone", memory.recent, seen, home);
  addDirectoryGroup(select, "recent sessions", recent, seen, home);
  const custom = document.createElement("option");
  custom.value = CUSTOM_PATH;
  custom.textContent = "type a path…";
  select.append(custom);

  const preferred = memory.last || home;
  if (pathDirty) {
    // The user is already typing: their input outranks anything that arrives late.
    select.value = CUSTOM_PATH;
    showPathField(true);
    return;
  }
  if (preferred && seen.has(preferred)) {
    select.value = preferred;
    $("newdir").value = preferred;
    showPathField(false);
  } else if (preferred) {
    select.value = CUSTOM_PATH;
    $("newdir").value = preferred;
    showPathField(true);
  } else {
    select.selectedIndex = 0;
    $("newdir").value = select.value === CUSTOM_PATH ? "" : select.value;
    showPathField(select.value === CUSTOM_PATH);
  }
}
function showPathField(show) {
  $("newdirfield").hidden = !show;
}
/** The directory the form will submit: the select, unless a custom path is showing. */
function chosenDirectory() {
  const select = $("newsuggest");
  if (select.value === CUSTOM_PATH || $("newdirfield").hidden === false) return $("newdir").value.trim();
  return select.value.trim();
}
async function loadDirectorySuggestions() {
  const select = $("newsuggest");
  const memory = loadDirectoryMemory();
  if (!pathDirty && memory.last) $("newdir").value = memory.last;
  select.replaceChildren();
  const loading = document.createElement("option");
  loading.value = ""; loading.textContent = "loading…";
  select.append(loading);
  try {
    const res = await api("/api/directories");
    if (!res.ok) throw new Error(String(res.status));
    renderDirectorySuggestions(await res.json());
  } catch {
    // A dropped tunnel must still leave a usable form rather than a stuck spinner,
    // and must say so: a bare "type a path…" reads as "this portal has no
    // directories".
    loading.textContent = "type a path…";
    loading.value = CUSTOM_PATH;
    select.value = CUSTOM_PATH;
    showPathField(true);
    const st = $("newstatus");
    st.textContent = "could not load directories — type a path";
    st.classList.add("err");
  }
}
function hideNewForm() {
  $("newform").hidden = true;
  $("new").setAttribute("aria-expanded", "false");
  $("new").textContent = "+ new";
  const st = $("newstatus");
  st.textContent = ""; st.classList.remove("err");
}
/* A toggle, not a one-way door: `+ new` sits where a thumb reaches to dismiss
   things, and re-running the load from there used to silently replace whatever
   had been typed. */
$("new").onclick = async () => {
  if (!$("newform").hidden) {
    hideNewForm();
    return;
  }
  pathDirty = false;
  $("newform").hidden = false;
  $("new").setAttribute("aria-expanded", "true");
  $("new").textContent = "× new";
  // Explicit, rather than relying on a focus side effect to scroll it into view.
  $("newform").scrollIntoView({ block: "start" });
  await loadDirectorySuggestions();
};
$("cancelnew").onclick = hideNewForm;
$("newsuggest").onchange = () => {
  const select = $("newsuggest");
  if (select.value === CUSTOM_PATH) {
    showPathField(true);
    $("newdir").focus();
    // Select rather than append: the field still holds the directory that was
    // chosen a moment ago, and erasing 20-odd characters on a phone keyboard to
    // type a different path is the worst part of this form.
    $("newdir").select();
    return;
  }
  showPathField(false);
  $("newdir").value = select.value;
  pathDirty = false;
};
$("newdir").oninput = () => {
  pathDirty = true;
  const select = $("newsuggest");
  select.value = CUSTOM_PATH;
  // A value matching no option paints a native select empty rather than falling
  // back to anything, which reads as broken.
  if (select.selectedIndex < 0) select.selectedIndex = 0;
};
$("start").onclick = async () => {
  const cwd = chosenDirectory();
  const st = $("newstatus");
  st.classList.remove("err");
  if (!cwd) { st.textContent = "pick a directory first"; st.classList.add("err"); return; }
  st.textContent = "starting…";
  $("start").disabled = true;
  let res;
  try {
    // Snapshot what is running *now*, not at the last 2s poll: a session another
    // client started inside that window would otherwise be adopted as this start's
    // arrival, which is the same misroute the cwd-only match caused. Falling back to
    // the last poll rather than to nothing: an empty set would make every session in
    // the directory look new, which is the misroute this exists to prevent.
    const running = await api("/api/sessions").then(r => (r.ok ? r.json() : null), () => null);
    awaitingKnownPids = new Set((running ?? lastSessions).map(s => s.pid));
    res = await post("/api/sessions/start", { cwd });
  } catch {
    // A rejected fetch (dropped tunnel, portal restarting) must not leave the form
    // disabled and reading "starting…" with no way back except a reload.
    $("start").disabled = false;
    st.textContent = "could not reach the portal — try again";
    st.classList.add("err");
    return;
  }
  if (res.ok) {
    // The server answers with the path it resolved, so `~/x` and `/Users/me/x`
    // stay one remembered entry.
    const body = await res.json().catch(() => ({}));
    const resolved = typeof body.cwd === "string" && body.cwd ? body.cwd : cwd;
    rememberDirectory(resolved);
    // `awaitingKnownPids` was snapshotted just before the request: the arrival has
    // to be a session that was not there then, or a directory that already hosts
    // one would match first and drop the user into the wrong agent.
    awaitingCwd = resolved;
    awaitingSince = Date.now();
    // Deliberately left disabled: the session takes a few seconds to appear, and
    // a second tap in that window starts a second agent in the same directory.
    st.textContent = "starting — opening the session as soon as it appears";
    setTimeout(refresh, 1000);
    return;
  }
  $("start").disabled = false;
  let msg = "start failed";
  try { msg = (await res.json()).error ?? msg; } catch {}
  st.textContent = msg;
  st.classList.add("err");
};
$("newdir").onkeydown = e => { if (e.key === "Enter") $("start").click(); };

/* Deep link: #<pid> opens that session directly, so a push notification or a
   bookmark can land on the session that needs an answer. The hash is also the
   only handle the platform back gesture has: without listening for it, iOS
   swipe-back left the URL pointing at the list while the session view stayed
   mounted with its stream open. */
function applyHash() {
  const pid = Number(location.hash.slice(1));
  const wanted = Number.isInteger(pid) && pid > 0 ? pid : null;
  if (wanted === current) return;
  if (wanted === null) {
    if (current !== null) closeSession();
    return;
  }
  if (document.querySelector(`.card[data-pid="${wanted}"]`) || current !== null) open(wanted);
}
addEventListener("hashchange", applyHash);
/* A rotation changes two things this app computes rather than inherits. The header
   label switches between basename and full path on width, and an idle session may
   never push another frame to re-render it. And the composer's height is a function
   of the field's *width*: a 91-character draft composed in landscape needs two rows
   there and three in portrait, and nothing else re-measures it, so the third line of
   the user's own text was drawn outside a scrollport that `overflow-y: hidden` gives
   no way to scroll — until the next keystroke happened to fix it. */
addEventListener("resize", () => {
  renderHeader();
  if (!$("composer").hidden) syncComposer();
});

/* ── keyboard-aware viewport ──────────────────────────────────────────────
   `#app` is a `100dvh` grid with the composer in its last row, which is correct
   on every platform whose on-screen keyboard resizes the *layout* viewport —
   Chrome on Android does, via `interactive-widget=resizes-content` in the meta
   tag at the top of this file.

   iOS is not one of them. WebKit leaves the layout viewport at full height, so
   `dvh` and `innerHeight` do not move, and shrinks only the visual viewport: the
   composer ends up behind the keyboard, and WebKit compensates by scrolling the
   whole document up to chase the caret. That scroll is the jank — the header
   leaves the top of the screen, and nothing scrolls it back when the keyboard
   goes away, so the app stays displaced until it is reloaded.

   So while a keyboard is open the shell is sized from the visual viewport and the
   document is pinned back to the top. Where the layout viewport already resized
   the measured inset is ~0 and none of this runs, which is what lets one code
   path be right on both platforms.

   `--app-h` is *removed* rather than set to the full height when the keyboard
   closes: `100dvh` is the better answer whenever it applies, because the browser
   tracks its own toolbar transitions with it and we would be writing a style
   property on every scroll frame to do the same job worse. */
const KEYBOARD_MIN_PX = 80;
/* How much of the screen an on-screen keyboard is covering, or 0 for none.

   Two things must not be mistaken for a keyboard. A pinch-zoom shrinks the visual
   viewport in exactly the same way, and binding the layout to it there would
   fight the pan the user is performing — hence the scale gate rather than a
   height comparison alone. And a collapsing browser toolbar moves both viewports
   together, so it nets out to a few pixels, well under the floor; a real keyboard
   is never under a third of the screen. */
function keyboardInsetOf(layoutHeight, viewport) {
  if (!viewport || viewport.scale > 1.01) return 0;
  const inset = layoutHeight - viewport.height - viewport.offsetTop;
  return inset > KEYBOARD_MIN_PX ? inset : 0;
}
const viewport = typeof visualViewport === "undefined" ? null : visualViewport;
if (viewport) {
  let pending = 0;
  const applyViewport = () => {
    pending = 0;
    const inset = keyboardInsetOf(innerHeight, viewport);
    // Read before the write: resizing the shell is what changes `scrollHeight`.
    const atBottom = isAtBottom();
    // The uncovered height, not `viewport.height`. The two differ by `offsetTop`,
    // which is how far WebKit has already scrolled the *visual* viewport down inside
    // the layout viewport to chase the caret — a scroll `scrollTo` cannot undo,
    // because it moves the document and the document here is not the scroller. Using
    // `viewport.height` while that offset stood left the shell short by exactly it,
    // so a strip of unusable app sat between the composer and the keyboard. What this
    // does not do is recover the header: the shell still starts at layout y 0, so an
    // `offsetTop` holds that much of it above the visible band either way. Fixing
    // that means offsetting the shell, not resizing it.
    if (inset > 0) document.documentElement.style.setProperty("--app-h", `${innerHeight - inset}px`);
    else document.documentElement.style.removeProperty("--app-h");
    document.body.classList.toggle("kb", inset > 0);
    // Only while a keyboard is up. WebKit's caret chase can also scroll the document
    // when it is scrollable, and that scroll is what strands the header off the top
    // of the screen once the keyboard goes away. Outside that case this must not
    // fire at all: `visualViewport` emits `scroll` throughout a pinch-pan, and
    // resetting the page under the gesture is the very thing the scale gate in
    // `keyboardInsetOf` exists to avoid.
    if (inset > 0 && scrollY !== 0) scrollTo(0, 0);
    if (atBottom) main.scrollTop = main.scrollHeight;
  };
  // Both events fire in bursts for the length of the keyboard animation, so this
  // coalesces to one layout write per frame.
  const scheduleViewport = () => {
    if (!pending) pending = requestAnimationFrame(applyViewport);
  };
  viewport.addEventListener("resize", scheduleViewport);
  viewport.addEventListener("scroll", scheduleViewport);
}

async function boot() {
  await refresh();
  applyHash();
}
boot();
setInterval(refresh, 2000);
/* The status line's `⏱` segment is the only thing on the page that moves without a
   frame arriving, so it gets its own slow tick rather than riding `refresh` — which
   returns early while a session is open, exactly when the clock is on screen. Ten
   seconds is well under the resolution of every value `durationText` prints past a
   minute, and `renderStatusLine` is a no-op with no session open. */
setInterval(renderStatusLine, 10_000);
</script>
